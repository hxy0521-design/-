<!DOCTYPE html><html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>工时记录 · 追光π</title>
<style>
/* ====== Design Tokens（与 static/index.html 保持一致）====== */
:root,[data-theme="light"]{
  --bg:#f0f2f8; --surface:#fff; --surface2:#f8f9fc;
  --border:#e8ecf4; --border2:#dde1ed;
  --tx:#2a2d3a; --tx2:#5a5f72; --tx3:#949aaf;
  --accent:#7c6ff7; --accent2:#a78bfa; --accent-light:#ede9fe;
  --orange:#fb923c; --orange-light:#fff7ed;
  --sky:#38bdf8; --sky-light:#e0f2fe;
  --green:#22c55e; --green-light:#dcfce7;
  --coral:#f47289; --coral-light:#fff1f3;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px rgba(0,0,0,.05),0 4px 6px rgba(0,0,0,.04);
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
[data-theme="dark"]{
  --bg:#0f1119; --surface:#1a1d2b; --surface2:#222636;
  --border:#2a2e3e; --border2:#343a4e;
  --tx:#e8eaf0; --tx2:#a0a6bc; --tx3:#6b718a;
  --accent:#a78bfa; --accent2:#c4b5fd; --accent-light:#1e1b4b;
  --orange:#fdba74; --orange-light:#2d1a0a;
  --sky:#7dd3fc; --sky-light:#0c2d3e;
  --green:#4ade80; --green-light:#0a2e12;
  --coral:#fda4af; --coral-light:#2d1118;
  --shadow:0 1px 3px rgba(0,0,0,.2); --shadow-md:0 4px 6px rgba(0,0,0,.25); --shadow-lg:0 10px 15px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 var(--font);background:var(--bg);color:var(--tx);
  transition:background .3s,color .3s;padding:22px 20px 60px}
.wrap{max-width:940px;margin:0 auto}

/* ---- header ---- */
header{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h1{font-size:20px;font-weight:600;letter-spacing:.5px}
.hsub{font-size:13px;color:var(--tx3)}
.spacer{flex:1}
.btn{font:inherit;font-size:13px;padding:6px 13px;border:1px solid var(--border2);
  background:var(--surface);color:var(--tx2);border-radius:var(--radius-sm);
  cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.88;color:#fff}
.btn.danger:hover{border-color:var(--coral);color:var(--coral)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:12px}

/* ---- cards ---- */
.cards{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:720px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow)}
.card-label{font-size:12px;color:var(--tx3);letter-spacing:.6px;margin-bottom:6px}
.big{font-size:42px;font-weight:600;font-variant-numeric:tabular-nums;
  line-height:1.1;letter-spacing:-1px}
.big.sm{font-size:30px}
.card-sub{font-size:12px;color:var(--tx3);margin-top:4px}
.cats{display:flex;gap:16px;margin-top:14px;flex-wrap:wrap}
.cat{display:flex;align-items:center;gap:7px;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.cat .cn{color:var(--tx2)}
.cat .cv{font-variant-numeric:tabular-nums;font-weight:600}

/* ---- control ---- */
.control{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.running{display:flex;align-items:center;gap:10px;flex:1;min-width:260px;
  padding:10px 14px;border-radius:var(--radius-sm);background:var(--surface2);
  border:1px solid var(--border)}
.running.idle{color:var(--tx3)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
.rtime{font-variant-numeric:tabular-nums;font-weight:600;font-size:17px;letter-spacing:-.3px}
.startrow{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{font:inherit;font-size:13px;font-weight:500;padding:9px 16px;border-radius:var(--radius-sm);
  border:1px solid transparent;cursor:pointer;transition:.15s;color:#fff;white-space:nowrap}
.sbtn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.sbtn:active{transform:translateY(0)}
.sbtn.active{opacity:1;box-shadow:0 0 0 3px var(--surface2),0 0 0 4px currentColor}

/* ---- 设置 ---- */
.settings{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 18px;box-shadow:var(--shadow);margin-bottom:22px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.settings label{font-size:13px;color:var(--tx2)}
select,input[type=date],input[type=time],input[type=text]{
  font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--border2);
  border-radius:var(--radius-xs);background:var(--surface);color:var(--tx)}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.hint{font-size:12px;color:var(--tx3)}

/* ---- 历史 ---- */
.histhead{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.histhead h2{font-size:15px;font-weight:600;margin-right:6px}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:2px;gap:2px}
.seg button{font:inherit;font-size:12.5px;padding:5px 12px;border:none;background:transparent;
  color:var(--tx2);border-radius:var(--radius-xs);cursor:pointer;transition:.15s;white-space:nowrap}
.seg button:hover{color:var(--accent)}
.seg button.on{background:var(--accent-light);color:var(--accent);font-weight:600}
[data-theme="dark"] .seg button.on{background:var(--accent-light);color:var(--accent2)}
.range-custom{display:none;align-items:center;gap:6px}
.range-custom.show{display:flex}

.day{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.dayhead{display:flex;align-items:center;gap:12px;padding:11px 16px;
  background:var(--surface2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.dayname{font-weight:600;font-size:13.5px}
.daytot{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent);font-size:13.5px}
.daycats{display:flex;gap:12px;font-size:12px;color:var(--tx3);margin-left:auto}
.row{display:grid;grid-template-columns:64px 118px 1fr auto;gap:12px;align-items:center;
  padding:9px 16px;border-bottom:1px solid var(--border);font-size:13px}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface2)}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:20px;
  text-align:center;white-space:nowrap}
.span{color:var(--tx2);font-variant-numeric:tabular-nums;font-size:13px}
.dur{font-variant-numeric:tabular-nums;color:var(--tx3);font-size:12.5px;white-space:nowrap}
.note{color:var(--tx2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts{display:flex;gap:6px}
.cont{font-size:11px;color:var(--tx3);margin-left:5px}
.empty{text-align:center;color:var(--tx3);padding:36px 0;font-size:13px}

/* ---- 弹窗 ---- */
dialog{border:1px solid var(--border);border-radius:var(--radius);padding:0;
  background:var(--surface);color:var(--tx);box-shadow:var(--shadow-lg);
  width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.32)}
.dlg-h{padding:15px 20px;border-bottom:1px solid var(--border);
  font-weight:600;font-size:14.5px}
.dlg-b{padding:18px 20px;display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12.5px;color:var(--tx2)}
.field input,.field select{width:100%;padding:7px 10px;font-size:13.5px}
.segs{display:flex;gap:6px}
.segs button{flex:1;font:inherit;font-size:13px;padding:8px;border:1px solid var(--border2);
  background:var(--surface);color:var(--tx2);border-radius:var(--radius-xs);cursor:pointer;
  transition:.15s}
.segs button.on{color:#fff;font-weight:500;border-color:transparent}
.dlg-f{padding:13px 20px;border-top:1px solid var(--border);display:flex;gap:8px;
  justify-content:flex-end;background:var(--surface2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);
  background:var(--tx);color:var(--bg);padding:9px 20px;border-radius:20px;font-size:13px;
  opacity:0;pointer-events:none;transition:.22s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<div class="wrap">

<header>
  <h1>工时记录</h1>
  <span class="hsub" id="hsub"></span>
  <span class="spacer"></span>
  <button class="btn" id="btnAdd">补记一段</button>
  <button class="btn" id="btnExport">导出 CSV</button>
  <button class="btn" id="btnTheme">深色</button>
</header>

<div class="cards">
  <div class="card">
    <div class="card-label">本周</div>
    <div class="big" id="weekTotal">0:00</div>
    <div class="card-sub" id="weekRange"></div>
    <div class="cats" id="weekCats"></div>
  </div>
  <div class="card">
    <div class="card-label">今日</div>
    <div class="big sm" id="todayTotal">0:00</div>
    <div class="card-sub" id="todayDate"></div>
    <div class="cats" id="todayCats"></div>
  </div>
</div>

<div class="control">
  <div class="running idle" id="runningBox">
    <span id="runDot"></span>
    <span id="runText">当前没有在计时</span>
    <span class="rtime" id="runTime"></span>
    <span class="spacer"></span>
    <button class="btn sm" id="btnPause" style="display:none">暂停</button>
  </div>
  <div class="startrow" id="startRow"></div>
</div>

<div class="settings">
  <label>一周从</label>
  <select id="selDay"></select>
  <select id="selHour"></select>
  <label>开始</label>
  <span class="hint">改完历史统计会按新周期自动重算</span>
  <span class="spacer"></span>
  <span class="hint" id="saveHint"></span>
</div>

<div class="histhead">
  <h2>历史回看</h2>
  <div class="seg" id="segRange">
    <button data-r="week" class="on">本周</button>
    <button data-r="lastweek">上周</button>
    <button data-r="d14">近 14 天</button>
    <button data-r="d30">近 30 天</button>
    <button data-r="custom">自定义</button>
  </div>
  <div class="range-custom" id="rangeCustom">
    <input type="date" id="cFrom"><span class="hint">→</span><input type="date" id="cTo">
    <button class="btn sm" id="btnRangeGo">查看</button>
  </div>
  <span class="spacer"></span>
  <span class="hint" id="histSum"></span>
</div>
<div id="histList"></div>

</div>

<dialog id="dlg">
  <form method="dialog">
    <div class="dlg-h" id="dlgTitle">补记一段</div>
    <div class="dlg-b">
      <div class="field"><span>类别</span>
        <div class="segs" id="dlgCats"></div>
      </div>
      <div class="field"><span>日期</span><input type="date" id="dlgDate"></div>
      <div class="row2">
        <div class="field"><span>开始</span><input type="time" id="dlgStart"></div>
        <div class="field"><span>结束</span><input type="time" id="dlgEnd"></div>
      </div>
      <div class="field"><span>备注</span>
        <input type="text" id="dlgNote" placeholder="比如：探索4班"></div>
      <div class="hint">结束时间早于开始时间会自动算作跨零点</div>
    </div>
    <div class="dlg-f">
      <button class="btn danger" type="button" id="dlgDelete" style="display:none">删除</button>
      <span class="spacer"></span>
      <button class="btn" type="button" id="dlgCancel">取消</button>
      <button class="btn primary" type="button" id="dlgSave">保存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
var API='/api';
var CATS=[], ST=null, EDIT_ID=null, EDIT_CAT='prep', RANGE='week', TICK=null;

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtHM(sec){sec=Math.max(0,Math.floor(sec||0));var h=Math.floor(sec/60/60),m=Math.floor(sec/60)%60;
  return h+':'+String(m).padStart(2,'0')}
function fmtCN(sec){sec=Math.max(0,Math.floor(sec||0));var h=Math.floor(sec/60/60),m=Math.floor(sec/60)%60;
  if(h&&m)return h+'小时'+String(m).padStart(2,'0')+'分';if(h)return h+'小时';return m+'分'}
function todayStr(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on')},1900)}

function api(path,opt){
  opt=opt||{};
  return fetch(API+path,opt).then(function(r){return r.json().then(function(d){
    if(!r.ok||d.status==='error')throw new Error(d.message||('HTTP '+r.status));
    return d})})
}

/* ---------------- 状态渲染 ---------------- */

function catMap(){var m={};CATS.forEach(function(c){m[c.key]=c});return m}

function renderRunning(){
  var run=ST.running, box=$('runningBox');
  if(run){
    var c=catMap()[run.category]||{color:'#888',label:run.category};
    box.className='running';
    $('runDot').innerHTML='<span class="pulse" style="background:'+c.color+'"></span>';
    $('runText').innerHTML='正在记录 <b style="color:'+c.color+'">'+esc(c.label)+'</b>'+
      (run.note?' <span class="hint">'+esc(run.note)+'</span>':'');
    $('btnPause').style.display='';
    tickRun();
    if(!TICK)TICK=setInterval(tickRun,1000);
  }else{
    box.className='running idle';
    $('runDot').innerHTML='';
    $('runText').textContent='当前没有在计时';
    $('runTime').textContent='';
    $('btnPause').style.display='none';
    if(TICK){clearInterval(TICK);TICK=null}
  }
}

function tickRun(){
  if(!ST||!ST.running)return;
  var s=new Date(ST.running.start_ts.replace(' ','T'));
  var sec=(Date.now()-s.getTime())/1000;
  if(sec<0)sec=0;
  $('runTime').textContent=fmtHM(sec);
}

function renderStartRow(){
  var run=ST.running;
  $('startRow').innerHTML=CATS.map(function(c){
    var on=run&&run.category===c.key;
    return '<button class="sbtn" data-cat="'+c.key+'" style="background:'+c.color+
      (on?';opacity:.55':';')+'">'+(on?'● ':'▶ ')+esc(c.label)+'</button>'}).join('');
  Array.prototype.forEach.call($('startRow').children,function(b){
    b.onclick=function(){doStart(b.dataset.cat)}})
}

function renderCats(el,totals,hm){
  el.innerHTML=CATS.map(function(c){
    return '<span class="cat"><span class="dot" style="background:'+c.color+'"></span>'+
      '<span class="cn">'+esc(c.label)+'</span>'+
      '<span class="cv">'+(hm&&hm[c.key]?hm[c.key]:'0:00')+'</span></span>'}).join('')
}

function renderStatus(){
  $('hsub').textContent='数据库：'+ST.db_path;
  $('weekTotal').textContent=ST.week_totals_hm.total||'0:00';
  $('weekRange').textContent=ST.week.label;
  renderCats($('weekCats'),ST.week_totals,ST.week_totals_hm);
  $('todayTotal').textContent=ST.today_totals_hm.total||'0:00';
  var d=new Date();$('todayDate').textContent=d.getMonth()+1+'月'+d.getDate()+'日';
  renderCats($('todayCats'),ST.today_totals,ST.today_totals_hm);
  renderRunning();renderStartRow();
  $('selDay').value=ST.week_start_day;$('selHour').value=ST.week_start_hour;
}

function loadStatus(){
  return api('/status').then(function(d){ST=d;renderStatus()}).catch(function(e){
    $('hsub').textContent='连不上服务：'+e.message});
}

/* ---------------- 动作 ---------------- */

function doStart(cat){
  api('/start',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({category:cat})}).then(function(d){
    if(d.auto_ended)toast('已结束「'+d.auto_ended.label+'」'+d.auto_ended.duration_cn+'，已切换');
    else toast('开始记录「'+(catMap()[cat]||{}).label+'」');
    ST=d;renderStatus();loadHistory()}).catch(function(e){toast('失败：'+e.message)})
}

function doPause(){
  api('/pause',{method:'POST'}).then(function(d){
    if(d.running===null||!d.running)toast('已暂停');ST=d;renderStatus();loadHistory()
  }).catch(function(e){toast('失败：'+e.message)})
}

/* ---------------- 历史 ---------------- */

function rangeDates(){
  var t=new Date(),from,to;
  function shift(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
  if(RANGE==='week'){from=new Date(ST.week.start.replace(' ','T'));
    to=shift(new Date(ST.week.end.replace(' ','T')),-1)}
  else if(RANGE==='lastweek'){var ws=new Date(ST.week.start.replace(' ','T'));ws.setDate(ws.getDate()-7);
    from=ws;to=shift(ws,6)}
  else if(RANGE==='d14'){from=shift(t,-13);to=t}
  else if(RANGE==='d30'){from=shift(t,-29);to=t}
  else{from=new Date($('cFrom').value||todayStr());to=new Date($('cTo').value||todayStr())}
  return [todayStr(from),todayStr(to)]
}

function loadHistory(){
  var r=rangeDates();
  api('/report?from='+r[0]+'&to='+r[1]).then(function(d){
    $('histSum').textContent=r[0]+' ~ '+r[1]+'　合计 '+d.total_cn;
    if(!d.days.length){$('histList').innerHTML='<div class="empty">这个区间还没有记录</div>';return}
    $('histList').innerHTML=d.days.map(function(day){
      var cats=CATS.filter(function(c){return day.by_category[c.key]})
        .map(function(c){return '<span class="cat"><span class="dot" style="background:'+c.color+
          ';width:7px;height:7px"></span>'+esc(c.label)+' '+day.by_category_hm[c.key]+'</span>'}).join('');
      return '<div class="day"><div class="dayhead"><span class="dayname">'+esc(day.label)+
        '</span><span class="daytot">'+day.total_hm+'</span>'+
        '<span class="daycats">'+cats+'</span></div>'+
        day.sessions.map(function(s){
          var c=catMap()[s.category]||{color:'#888',label:s.category};
          var end=s.seg_end||'计时中';
          return '<div class="row">'+
            '<span class="tag" style="background:'+c.color+'22;color:'+c.color+'">'+esc(c.label)+'</span>'+
            '<span class="span">'+s.seg_start+'–'+end+'</span>'+
            '<span class="note">'+esc(s.note||'')+(s.continued?'<span class="cont">接上一日</span>':'')+'</span>'+
            '<span class="acts"><span class="dur">'+s.seg_cn+'</span>'+
            '<button class="btn sm" data-edit="'+s.id+'" data-day="'+day.date+'">编辑</button></span>'+
            '</div>'}).join('')+'</div>'}).join('');
    Array.prototype.forEach.call($('histList').querySelectorAll('[data-edit]'),function(b){
      b.onclick=function(){openEdit(parseInt(b.dataset.edit,10))}})
  }).catch(function(e){$('histList').innerHTML='<div class="empty">读不到历史：'+esc(e.message)+'</div>'})
}

/* ---------------- 补记 / 编辑 ---------------- */

function nowHM(){
  var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')
}

function openEdit(id){
  EDIT_ID=id;
  var done=function(s){
    if(!s){toast('记录不存在');return}
    EDIT_CAT=s.category;
    // 正在计时的记录没有结束时间，用「现在」预填——保存就等于手动停止在这一刻
    $('dlgTitle').textContent=s.running?'编辑正在计时的记录':'编辑记录 #'+s.id;
    $('dlgDate').value=s.date;$('dlgStart').value=s.start;
    $('dlgEnd').value=s.end||nowHM();$('dlgNote').value=s.note||'';
    $('dlgDelete').style.display='';
    renderDlgCats();$('dlg').showModal()
  };
  // 历史条目和正在计时的记录都能编辑
  if(ST&&ST.running&&ST.running.id===id)return done(ST.running);
  var r=rangeDates();
  api('/report?from='+r[0]+'&to='+r[1]).then(function(d){
    var hit=null;
    d.days.forEach(function(day){day.sessions.forEach(function(s){if(s.id===id)hit=s})});
    done(hit)
  }).catch(function(e){toast('失败：'+e.message)})
}

function openAdd(){
  EDIT_ID=null;EDIT_CAT='prep';
  $('dlgTitle').textContent='补记一段';
  $('dlgDate').value=todayStr();
  $('dlgStart').value='';$('dlgEnd').value='';$('dlgNote').value='';
  $('dlgDelete').style.display='none';
  renderDlgCats();$('dlg').showModal()
}

function renderDlgCats(){
  $('dlgCats').innerHTML=CATS.map(function(c){
    return '<button type="button" data-c="'+c.key+'" class="'+(c.key===EDIT_CAT?'on':'')+
      '" style="'+(c.key===EDIT_CAT?'background:'+c.color:'')+'">'+esc(c.label)+'</button>'}).join('');
  Array.prototype.forEach.call($('dlgCats').children,function(b){
    b.onclick=function(){EDIT_CAT=b.dataset.c;renderDlgCats()}})
}

function saveDlg(){
  var body={category:EDIT_CAT,date:$('dlgDate').value,start:$('dlgStart').value,
    end:$('dlgEnd').value,note:$('dlgNote').value};
  if(!body.start||!body.end){toast('开始和结束时间都要填');return}
  var p=EDIT_ID
    ?api('/sessions/'+EDIT_ID,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    :api('/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  p.then(function(d){$('dlg').close();ST=d;renderStatus();loadHistory();
    toast(EDIT_ID?'已保存':'已补记')}).catch(function(e){toast('失败：'+e.message)})
}

function delDlg(){
  if(!EDIT_ID)return;
  if(!confirm('确定删除这条记录？删了就没了。'))return;
  api('/sessions/'+EDIT_ID,{method:'DELETE'}).then(function(d){
    $('dlg').close();ST=d;renderStatus();loadHistory();toast('已删除')
  }).catch(function(e){toast('失败：'+e.message)})
}

/* ---------------- 设置 ---------------- */

function saveConfig(){
  api('/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({week_start_day:+$('selDay').value,week_start_hour:+$('selHour').value})})
  .then(function(d){ST=d;renderStatus();loadHistory();
    $('saveHint').textContent='已保存，历史已重算';
    setTimeout(function(){$('saveHint').textContent=''},2200)
  }).catch(function(e){toast('失败：'+e.message)})
}

/* ---------------- 初始化 ---------------- */

function initTheme(){
  // 没手动选过就跟随系统
  var t=localStorage.getItem('wt-theme')
    ||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.documentElement.dataset.theme=t;
  $('btnTheme').textContent=t==='dark'?'浅色':'深色';
  $('btnTheme').onclick=function(){
    var n=document.documentElement.dataset.theme==='dark'?'light':'dark';
    document.documentElement.dataset.theme=n;localStorage.setItem('wt-theme',n);
    $('btnTheme').textContent=n==='dark'?'浅色':'深色'}
}

function init(){
  initTheme();
  var d=new Date();
  $('cFrom').value=todayStr(new Date(d.getTime()-6*864e5));
  $('cTo').value=todayStr();
  $('selDay').innerHTML=[1,2,3,4,5,6,7].map(function(i){
    return '<option value="'+i+'">周'+'一二三四五六日'[i-1]+'</option>'}).join('');
  $('selHour').innerHTML=Array.from({length:24},function(_,h){
    return '<option value="'+h+'">'+String(h).padStart(2,'0')+':00</option>'}).join('');
  api('/categories').then(function(r){
    CATS=r.categories;return loadStatus()
  }).then(loadHistory)
   .catch(function(e){$('histList').innerHTML='<div class="empty">连不上服务：'+esc(e.message)+'</div>'});

  $('btnPause').onclick=doPause;
  $('btnAdd').onclick=openAdd;
  $('btnExport').onclick=function(){var r=rangeDates();
    window.location=API+'/export.csv?from='+r[0]+'&to='+r[1]};
  $('selDay').onchange=saveConfig;$('selHour').onchange=saveConfig;
  $('dlgSave').onclick=saveDlg;$('dlgDelete').onclick=delDlg;
  $('dlgCancel').onclick=function(){$('dlg').close()};
  Array.prototype.forEach.call($('segRange').children,function(b){
    b.onclick=function(){
      Array.prototype.forEach.call($('segRange').children,function(x){x.classList.remove('on')});
      b.classList.add('on');RANGE=b.dataset.r;
      $('rangeCustom').classList.toggle('show',RANGE==='custom');
      if(RANGE!=='custom')loadHistory()}})
  $('btnRangeGo').onclick=loadHistory;

  setInterval(loadStatus,10000);   // 别处改了状态，这里十几秒内跟上
}
init();
</script></body></html>
