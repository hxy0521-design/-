<!DOCTYPE html><html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>追光π · 思辨工作室</title><link rel="icon" href="/static/logo.png">
<style>
/* ====== Design Tokens ====== */
:root,[data-theme="light"]{
  --bg:#f0f2f8; --surface:#fff; --surface2:#f8f9fc;
  --border:#e8ecf4; --border2:#dde1ed;
  --tx:#2a2d3a; --tx2:#5a5f72; --tx3:#949aaf;
  --accent:#7c6ff7; --accent2:#a78bfa; --accent-light:#ede9fe;
  --lime:#84cc16; --lime-light:#ecfccb;
  --orange:#fb923c; --orange-light:#fff7ed;
  --coral:#f47289; --coral-light:#fff1f3;
  --sky:#38bdf8; --sky-light:#e0f2fe;
  --green:#22c55e; --green-light:#dcfce7;
  --amber:#f59e0b; --amber-light:#fef3c7;
  --shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg:0 10px 15px rgba(0,0,0,.05),0 4px 6px rgba(0,0,0,.04);
  --radius:12px; --radius-sm:8px; --radius-xs:6px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  /* legacy compat */
  --bl:var(--accent); --go:var(--lime); --rd:var(--coral); --sb:var(--tx3); --bd:var(--border); --p:var(--surface);
}
[data-theme="dark"]{
  --bg:#0f1119; --surface:#1a1d2b; --surface2:#222636;
  --border:#2a2e3e; --border2:#343a4e;
  --tx:#e8eaf0; --tx2:#a0a6bc; --tx3:#6b718a;
  --accent:#a78bfa; --accent2:#c4b5fd; --accent-light:#1e1b4b;
  --lime:#a3e635; --lime-light:#1a2e0a;
  --orange:#fdba74; --orange-light:#2d1a0a;
  --coral:#fda4af; --coral-light:#2d1118;
  --sky:#7dd3fc; --sky-light:#0c2d3e;
  --green:#4ade80; --green-light:#0a2e12;
  --amber:#fcd34d; --amber-light:#2d2006;
  --shadow:0 1px 3px rgba(0,0,0,.2); --shadow-md:0 4px 6px rgba(0,0,0,.25); --shadow-lg:0 10px 15px rgba(0,0,0,.3);
  --bl:var(--accent); --go:var(--lime); --rd:var(--coral); --sb:var(--tx3); --bd:var(--border); --p:var(--surface);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 var(--font);background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh;overflow:hidden;transition:background .3s,color .3s}
.pl{width:200px;min-width:200px;max-width:200px;padding:10px;border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);transition:background .3s}
.pc{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);transition:background .3s,width .3s}
.pr{width:420px;min-width:90px;padding:16px;border-left:1px solid var(--border);overflow-y:auto;background:var(--surface);transition:background .3s}
h2{font-size:15px;margin-bottom:8px;color:var(--accent);font-weight:700}h3{font-size:13px;margin:12px 0 6px;color:var(--tx2);font-weight:600}
.ci{padding:8px 12px;margin:3px 0;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;transition:all .2s;font-weight:500}.ci:hover{background:var(--accent-light);color:var(--accent)}
.li{font-size:11px;color:var(--tx2);padding:3px 0 3px 8px;cursor:pointer;border-radius:4px;transition:all .15s}.li:hover{color:var(--accent);background:var(--accent-light)}
.btn{padding:8px 16px;border-radius:var(--radius-xs);border:none;cursor:pointer;font-size:13px;margin:3px;transition:all .2s;font-weight:500;letter-spacing:.01em}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(0)}
.bp{background:var(--accent);color:#fff}.bp:hover{background:var(--accent2)}
.bg{background:var(--lime);color:#1a2e0a;font-weight:600}.bg:hover{background:#a3e635}
.bo{background:var(--surface);color:var(--tx2);border:1.5px solid var(--border)}.bo:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
input,textarea,select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font:13px/1.5 var(--font);margin:3px 0;background:var(--bg);color:var(--tx);transition:border .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
textarea{min-height:100px;font-family:"SF Mono",ui-monospace,monospace;resize:vertical;line-height:1.5}
.mr{display:flex;gap:10px}.mr input{flex:1}
.tabs{display:flex;gap:0;padding:6px 16px 0;border-bottom:1.5px solid var(--border);min-height:36px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;font-size:12px;background:var(--surface2);border:1.5px solid var(--border);border-bottom:none;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;transition:all .2s;color:var(--tx2);margin-right:2px}.tab:hover{background:var(--accent-light)}
.tab.ac{background:var(--surface);color:var(--accent);font-weight:700;border-color:var(--accent);border-bottom:2px solid var(--accent)}
.tab .close{margin-left:8px;font-size:12px;opacity:.4;cursor:pointer;transition:all .15s}.tab .close:hover{opacity:1;color:var(--coral)}
.ed-body{flex:1;overflow-y:auto;padding:16px 20px}
.tb{background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;margin:8px 0;transition:border .2s}.tb:focus-within{border-color:var(--accent)}
.tt{font-weight:600;color:var(--accent);margin-bottom:8px;display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}
.tt input{flex:1;margin:0}.tt span{flex-shrink:0;color:var(--tx2);font-size:12px}
.sa{min-height:60px;margin:4px 0;font-size:12px}.sa.collapsed{display:none}
.st{font-size:12px;color:var(--tx3);margin:6px 0}
.op{padding:10px;margin:4px 0;border-radius:var(--radius-xs);background:var(--surface2);border:1.5px solid var(--border);font-size:12px;transition:all .15s}.op:hover{background:var(--accent-light)}.op a{color:var(--accent);text-decoration:none;font-weight:500}
.pt{white-space:pre-wrap;font-size:12px;background:var(--surface2);padding:16px;border-radius:var(--radius);border:1.5px solid var(--border);line-height:1.7;text-align:left}
.kpi-card{background:var(--surface);border-radius:var(--radius);padding:20px;text-align:center;border-top:3.5px solid #ccc;box-shadow:var(--shadow);transition:all .25s;cursor:default}
.kpi-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.kpi-label{font-size:11px;color:var(--tx3);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi-val{font-size:26px;font-weight:800;color:var(--tx);letter-spacing:-.01em}
.kpi-u{font-size:13px;font-weight:500;color:var(--tx3);margin-left:3px}
.maintab{transition:all .2s;letter-spacing:.01em;font-family:var(--font)}
.maintab:hover{transform:translateY(-1px)}
.datatable{width:100%;border-collapse:collapse;font-size:12px;border-radius:var(--radius-sm);overflow:hidden}.datatable th{padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);color:var(--tx3);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--surface2)}.datatable td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--tx2)}.datatable tbody tr{transition:background .15s}.datatable tbody tr:hover td{background:var(--accent-light)}
.section-card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);border:1.5px solid var(--border);transition:all .2s}
.section-card:hover{box-shadow:var(--shadow-md)}
.section-title{font-size:15px;font-weight:700;color:var(--tx);margin:0 0 12px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.02em}
.tag-green{background:var(--green-light);color:var(--green)}.tag-yellow{background:var(--amber-light);color:var(--amber)}.tag-red{background:var(--coral-light);color:var(--coral)}.tag-blue{background:var(--sky-light);color:var(--sky)}
.filter-btn{padding:5px 12px;border-radius:999px;border:1.5px solid var(--border);font-size:11px;cursor:pointer;transition:all .2s;background:var(--surface);color:var(--tx2);font-weight:500;font-family:var(--font)}
.filter-btn:hover{border-color:var(--accent);color:var(--accent)}.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:var(--shadow)}
@keyframes spin{to{transform:rotate(360deg)}}
.theme-toggle{position:fixed;bottom:16px;right:16px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);color:var(--tx2);font-size:18px;cursor:pointer;z-index:999;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);transition:all .3s}
.theme-toggle:hover{transform:scale(1.1);border-color:var(--accent);color:var(--accent)}
hr{border:none;border-top:1.5px dashed var(--border);margin:18px 0;opacity:.6}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px}::-webkit-scrollbar-thumb:hover{background:var(--tx3)}
</style></head><body>
<button class="theme-toggle" onclick="toggleTheme()" title="切换深色模式">🌙</button>
<div style="display:flex;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface)" id="topBar"><div id="mainTabs" style="display:flex;gap:4px;padding:4px 8px 0;overflow-x:auto;flex-shrink:0;"></div></div><div style="display:flex;flex:1;overflow:hidden" id="mainRow"><div class="panel pl" style="display:none"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><label style="font-size:11px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="chkXinxin" onchange="onUserChange()" style="width:auto;margin:0 2px">只看欣欣</label><label style="font-size:11px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="chkBiscuit" onchange="onUserChange()" style="width:auto;margin:0 2px">只看饼干</label></div><h2>班级 <span style="font-size:10px;float:right"><a href="#" onclick="expandAll(event)" style="color:var(--sb)">展开</a> | <a href="#" onclick="collapseAll(event)" style="color:var(--sb)">折叠</a></span></h2><div id="classList"></div><button class="btn bo" style="margin-top:4px;width:100%" onclick="newUnitAll()">+ 新建单元</button><button class="btn bo" style="margin-top:4px;width:100%" onclick="newClass()">+ 新建班级</button><h3 style="margin-top:18px">输出文件</h3><div id="outputList"></div></div>
<div class="panel pc"><div class="tabs" id="tabBar"></div><div class="ed-body" id="editorBody"><div style="color:var(--sb);text-align:center;padding:60px 0">加载中...</div></div></div>
<div class="panel pr" id="previewPanel" style="display:none"><h2 style="cursor:pointer" onclick="togglePreview()"><span id="pvLabel">预览</span> <span id="pvHint" style="font-size:11px;color:var(--sb)">点击收起</span></h2><div id="previewContent" style="font-size:12px;color:var(--sb)">粘贴发言后在此预览</div></div>
<script>
function fv(v){return parseFloat(v)||0;}
function fv(v){return parseFloat(v)||0;}
var API=window.location.origin+'/api';
function toggleTheme(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);var btn=document.querySelector('.theme-toggle');btn.textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('theme',t)}
(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);var btn=document.querySelector('.theme-toggle');if(btn)btn.textContent=t==='dark'?'☀️':'🌙'})();
var tabs={},activeTab=null,activeMainTab='overview',cfgReady=false;
// Event delegation for topic buttons (bypasses innerHTML onclick issues)
document.addEventListener('click',function(e){
  var btn=e.target.closest('button');if(!btn)return;
  var act=btn.getAttribute('data-act');if(!act)return;
  if(act==='format')formatTopic(parseInt(btn.getAttribute('data-idx')));
  else if(act==='addBullet')addBullets(parseInt(btn.getAttribute('data-idx')));
  else if(act==='removeBullet')removeBullets(parseInt(btn.getAttribute('data-idx')));
  else if(act==='formatAllBtn')formatAll();
  else if(act==='addBulletAllBtn')addBulletsAll();
  else if(act==='removeBulletAllBtn')removeBulletsAll();
});
var cache={};
function cachedFetch(url,force){return new Promise(function(resolve){if(!force&&cache[url])return resolve({json:function(){return Promise.resolve(cache[url])}});fetch(url).then(function(r){return r.json()}).then(function(d){cache[url]=d;resolve({json:function(){return Promise.resolve(d)}})})})}
function switchMainTab(){
  var el=document.getElementById('editorBody');if(!el)return;
  var pl=document.querySelector('.pl');var pr=document.getElementById('previewPanel');var tb=document.getElementById('tabBar');
  var isEdit=activeMainTab==='edit';
  if(pl)pl.style.display=isEdit?'block':'none';
  if(pr)pr.style.display=isEdit?'block':'none';
  if(tb)tb.style.display=isEdit?'':'none';
  if(!isEdit)document.querySelector('.pc').style.width='100%';
  el.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--sb)"><div style="display:inline-block;width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite"></div></div>';
  if(activeMainTab==='overview')renderOverviewTab();
  else if(activeMainTab==='edit'){if(activeTab)renderEditor();else el.innerHTML='<div style=\"color:var(--sb);text-align:center;padding:60px 0\">请从左侧选择班级</div>'}
  else if(activeMainTab==='attendance')renderAttendanceTab();
  else if(activeMainTab==='students')renderStudentTab();
  else if(activeMainTab==='payments')renderPaymentTab();
  else if(activeMainTab==='splits')renderRevenueSplitTab();
  else if(activeMainTab==='settle')renderSettleTab();
  else if(activeMainTab==='settle')renderSettleTab();
  else if(activeMainTab==='pricing')renderPricingTab();
  else el.innerHTML='<div style=\"color:var(--sb);text-align:center;padding:60px 0\">请从左侧选择班级</div>';
}
var _lastSaved='';
function renderMainTabs(){
  var tb=document.getElementById('mainTabs');if(!tb)return;
  var items=[{id:'overview',label:'总览'},{id:'edit',label:'编辑'},{id:'attendance',label:'消课'},{id:'students',label:'学生'},{id:'payments',label:'缴费'},{id:'splits',label:'分账'},{id:'settle',label:'结算'},{id:'pricing',label:'定价'}];
  tb.innerHTML='';
  items.forEach(function(it){
    var t=document.createElement('button');t.textContent=it.label;
    t.className='maintab';t.style.cssText='padding:6px 14px;border-radius:8px 8px 0 0;border:none;background:'+(activeMainTab===it.id?'var(--accent)':'transparent')+';color:'+(activeMainTab===it.id?'#fff':'var(--sb)')+';font-size:12px;cursor:pointer;font-weight:'+(activeMainTab===it.id?'600':'400');
    t.onclick=function(){switchTabWithCheck(it.id)};
    tb.appendChild(t);
  });
}
function hasUnsaved(){
  if(!activeTab||activeMainTab!=='edit')return false;
  var d=tabs[activeTab];if(!d)return false;
  return JSON.stringify(d)!==_lastSaved;
}
function switchTabWithCheck(targetTab){
  if(activeMainTab==='edit'&&targetTab!=='edit'&&hasUnsaved()){
    var ov=document.createElement('div');ov.className="zg-modal-overlay";ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center';
    ov.innerHTML='<div style="background:var(--surface);border-radius:14px;padding:24px;max-width:380px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center"><h3 style="margin:0 0 8px">未保存的修改</h3><div style="font-size:13px;color:var(--tx2);margin-bottom:20px">当前课节有未保存的内容，是否保存？</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn bp" style="padding:8px 20px" onclick="var btn=this;btn.textContent=\'保存中...\';btn.disabled=true;saveToServer();var check=setInterval(function(){var st=document.getElementById(\'saveStatus\');if(st&&st.textContent.indexOf(\'已保存\')>=0){clearInterval(check);btn.textContent=\'已保存\';setTimeout(function(){_lastSaved=JSON.stringify(tabs[activeTab]||{});activeMainTab=\''+targetTab+'\';renderMainTabs();switchMainTab()},1000)}},200)">保存</button><button class="btn bo" style="padding:8px 20px" onclick="this.closest(\'div\').parentElement.remove();activeMainTab=\''+targetTab+'\';renderMainTabs();switchMainTab()">放弃</button><button class="btn bo" style="padding:8px 20px" onclick="this.closest(\'div\').parentElement.remove()">取消</button></div></div>';
    document.body.appendChild(ov);
  }else{
    activeMainTab=targetTab;renderMainTabs();switchMainTab();
  }
}
function getCheckedUsers(){var u=[];if(document.getElementById('chkXinxin')&&document.getElementById('chkXinxin').checked)u.push('欣欣');if(document.getElementById('chkBiscuit')&&document.getElementById('chkBiscuit').checked)u.push('饼干');return u}
function onUserChange(){renderClassList()}

fetch(API+'/config').then(function(r){return r.json()}).then(function(d){
  if(!Object.keys(d).length){alert('欢迎！尚未配置班级，请点击左侧 + 新建班级 创建第一个班级。')}
  cfgReady=true;
}).catch(function(){});

function expandAll(e){e.preventDefault();document.querySelectorAll('#classList .ci').forEach(function(d){var u=d.nextElementSibling;if(u){u.style.display='block';u.querySelectorAll('div>div').forEach(function(l){l.style.display='block'})}})}
function collapseAll(e){e.preventDefault();document.querySelectorAll('#classList .ci').forEach(function(d){var u=d.nextElementSibling;if(u){u.style.display='none'}})}

function renderClassList(){
  var el=document.getElementById('classList');el.innerHTML='';
  var filter=getCheckedUsers().length>0;
  // Build class list from cfgInfo + allLessons (loaded once via /api/config)
  var hiddenClasses=['周三启航','寒假先锋','寒假启航1班','寒假启航2班','寒假探索','混龄特典','纯试听','周五领航','周六先锋'];
  Object.keys(cfgInfo).forEach(function(cls){
    if(hiddenClasses.indexOf(cls)>=0)return;
    var units=cfgInfo[cls];if(!Object.keys(units).length)return;
    if(filter){var hasMine=Object.values(units).some(function(u){return getCheckedUsers().indexOf(u.created_by)>=0});if(!hasMine)return}
    var d=document.createElement('div');d.className='ci';d.style.cssText='display:flex;align-items:center;cursor:pointer';
    d.onclick=function(e){if(e.target.tagName==='BUTTON')return;var ul=this.nextElementSibling;if(ul)ul.style.display=ul.style.display==='none'?'block':'none'};
    var cnSpan=document.createElement('span');cnSpan.textContent=cls;cnSpan.style.flex='1';
    d.appendChild(cnSpan);
    var trashBtn=document.createElement('button');trashBtn.innerHTML='<svg width=\"12\" height=\"14\" viewBox=\"0 0 12 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"><path d=\"M1 3h10M4 3V2a1 1 0 011-1h2a1 1 0 011 1v1M2 3v10a1 1 0 001 1h6a1 1 0 001-1V3M4.5 6v5M7.5 6v5\"/></svg>';trashBtn.title='删除班级';
    trashBtn.style.cssText='border:none;background:none;cursor:pointer;color:var(--sb);padding:0 2px;opacity:.4;flex-shrink:0';
    trashBtn.onclick=function(e){e.stopPropagation();deleteClass(cls,units)};
    d.appendChild(trashBtn);
    el.appendChild(d);
    var unitDiv=document.createElement('div');unitDiv.style.cssText='display:none;padding-left:4px';
    var unitKeys=Object.keys(units);
    unitKeys.forEach(function(un,idx){
      var uname=(units[un]&&units[un].name)||un;
      var isLast=(idx===unitKeys.length-1);
      var uh=document.createElement('div');
      uh.style.cssText='font-size:12px;color:var(--go);padding:2px 0;cursor:pointer;display:flex;align-items:center;position:relative';
      uh.innerHTML='<span style="flex:1">'+uname+'</span>';
      var trashBtn2=document.createElement('button');trashBtn2.innerHTML='<svg width=\"12\" height=\"14\" viewBox=\"0 0 12 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"><path d=\"M1 3h10M4 3V2a1 1 0 011-1h2a1 1 0 011 1v1M2 3v10a1 1 0 001 1h6a1 1 0 001-1V3M4.5 6v5M7.5 6v5\"/></svg>';trashBtn2.title='删除单元';
      trashBtn2.style.cssText='border:none;background:none;cursor:pointer;color:var(--sb);padding:0 3px;position:absolute;right:22px;opacity:.4';
      trashBtn2.onclick=function(e){e.stopPropagation();deleteUnit(cls,un,uname)};
      uh.appendChild(trashBtn2);
      var addBtn=document.createElement('button');addBtn.textContent='+';addBtn.title='新建课节';
      addBtn.style.cssText='border:none;background:none;cursor:pointer;font-size:14px;color:var(--sb);padding:0 2px;position:absolute;right:8px';
      addBtn.onclick=function(e){e.stopPropagation();newLesson(cls,un,uname)};
      uh.appendChild(addBtn);
      uh.onclick=function(e){e.stopPropagation();var ul=this.nextElementSibling;if(ul)ul.style.display=ul.style.display==='none'?'block':'none'};
      unitDiv.appendChild(uh);
      var ldiv=document.createElement('div');ldiv.style.cssText='padding-left:0px;'+(isLast?'':'display:none');
      var lessons=allLessons[cls]&&allLessons[cls][un]?allLessons[cls][un]:[];
      lessons.forEach(function(l){
        var li=document.createElement('div');li.className='li';
        var dt=(l.date||'');var shortDt=dt.length>=10?dt.slice(5).replace(/-/g,''):dt;

function handleImagePaste(e,topicIdx){

  reader.readAsDataURL(blob);

function showCalendarModal(){

  // Go back to find the first Tue that could touch this month
  var wkStart=new Date(y,mo,1);
  while(wkStart.getDay()!==2) wkStart.setDate(wkStart.getDate()-1);
  // Collect all weeks that overlap with this month
  var weeks=[];

    var ws=new Date(wkStart);ws.setDate(ws.getDate()+w*7);

function _calcPayAmtForStud(){
  var seg=document.getElementById('rfSeg').value,type=document.getElementById('rfType').value,disc=document.getElementById('rfDisc').value,cnt=parseInt(document.getElementById('rfCnt').value)||1;
  if(!seg||!type||!disc){return}
  _loadPricing(function(pricing){
    var found=pricing.filter(function(p){return p.segment===seg&&p.course_type===type&&p.discount_type===disc});
    if(found.length){var p=found[0];var amt=Math.round(p.unit_price*p.discount_multiplier*cnt);document.getElementById('rfAmt').value=amt}
  });
}

      h+='</div>';

    if(settlements.length){
      var totals={};settlements.forEach(function(s){var n=s.teacher_name;if(!totals[n])totals[n]=0;totals[n]+=fv(s.amount)});
      h+='<div style="margin-top:16px"><h4 style="margin:0 0 8px">结算历史</h4><div style="display:flex;gap:16px;margin-bottom:8px;font-size:14px">';
      Object.keys(totals).forEach(function(n){h+='<span><b>'+n+'</b> ¥'+totals[n].toFixed(0)+'</span>'});
      h+='<span style="margin-left:8px;color:var(--accent)"><b>合计 ¥'+Object.values(totals).reduce(function(a,b){return a+b},0).toFixed(0)+'</b></span></div>';
      h+='<div style="overflow-x:auto"><table style="border-collapse:collapse;font-size:13px;width:100%"><thead><tr style="border-bottom:2px solid #e2e8f0;color:var(--sb)"><th style="padding:6px 10px;text-align:center">教师</th><th style="padding:6px 10px;text-align:center">周期</th><th style="padding:6px 10px;text-align:center">金额</th><th style="padding:6px 10px;text-align:center">课时</th><th style="padding:6px 10px;text-align:center">教研</th><th style="padding:6px 10px;text-align:center">日期</th><th style="padding:6px 10px"></th></tr></thead><tbody>';
      settlements.forEach(function(s){
        h+='<tr style="border-bottom:1px solid #f1f5f9">';
        h+='<td style="padding:6px 10px;text-align:center"><b>'+esc(s.teacher_name)+'</b></td>';
        h+='<td style="padding:6px 10px;text-align:center">'+s.cycle.split(", ").length+'周期</td>';
        h+='<td style="padding:6px 10px;text-align:center">¥'+fv(s.amount).toFixed(0)+'</td>';
        h+='<td style="padding:6px 10px;text-align:center">¥'+fv(s.lesson_share).toFixed(0)+'</td>';
        h+='<td style="padding:6px 10px;text-align:center">¥'+fv(s.teaching_share).toFixed(0)+'</td>';
        h+='<td style="padding:6px 10px;text-align:center;font-size:12px">'+(s.created_at||'')+'</td>';
        h+='<td style="padding:6px 10px;text-align:center"><button onclick="deleteSettlement('+s.id+')" style="border:none;background:none;color:var(--coral);cursor:pointer;font-size:12px">删</button></td></tr>';
      });
      h+='</tbody></table></div></div>';
    }
    h+='</div>';el.innerHTML=h;
    el.addEventListener('click',function(e){var a=e.target.closest('.settleSelectAll');if(!a)return;e.preventDefault();var cyc=a.getAttribute('data-cyc');var cbs=document.querySelectorAll('[data-cyc="'+cyc+'"]');cbs.forEach(function(cb){if(!cb.disabled)cb.checked=true})});
  });
}
function generateSingleCycleSettlement(cyc){
  var checked=document.querySelectorAll('input[data-cyc="'+cyc+'"]:checked');if(!checked.length){alert('请勾选至少一位教师');return}
  var now=new Date().toISOString().slice(0,10);var items=[];
  checked.forEach(function(cb){var name=cb.value,label=cb.parentElement;var b=label.querySelector('b');if(!b)return;var amt=parseFloat(b.textContent.replace('¥',''))||0;var spans=label.querySelectorAll('span');var lAmt=0,tAmt=0;spans.forEach(function(sp){var txt=sp.textContent;var m;m=txt.match(/课¥([\d.]+)/);if(m)lAmt=parseFloat(m[1])||0;m=txt.match(/研¥([\d.]+)/);if(m)tAmt=parseFloat(m[1])||0;m=txt.match(/招¥([\d.]+)/);if(m)lAmt+=parseFloat(m[1])||0;m=txt.match(/转¥([\d.]+)/);if(m)lAmt+=parseFloat(m[1])||0;m=txt.match(/续¥([\d.]+)/);if(m)lAmt+=parseFloat(m[1])||0});items.push({teacher_name:name,cycle:cyc,amount:amt,lesson_share:lAmt,teaching_share:tAmt,source_share:0,detail:cyc,created_at:now})});
  fetch(API+'/settlements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch:true,items:items,created_at:now})}).then(function(r){return r.json()}).then(function(d){if(d.status==='ok'){renderSettleTab()}else alert('生成失败')});
}
function generateCrossSettlements(){
  var checked=document.querySelectorAll('input[type=checkbox]:checked');if(!checked.length){alert('请至少勾选一位教师');return}
  var now=new Date().toISOString().slice(0,10);var byTeacher={};
  checked.forEach(function(cb){var name=cb.value,cyc=cb.getAttribute('data-cyc');if(!name||!cyc)return;var label=cb.parentElement;var b=label.querySelector('b');if(!b)return;var amt=parseFloat(b.textContent.replace('¥',''))||0;var spans=label.querySelectorAll('span');var lAmt=0,tAmt=0;spans.forEach(function(sp){var txt=sp.textContent;var m;m=txt.match(/课¥([\d.]+)/);if(m)lAmt=parseFloat(m[1])||0;m=txt.match(/研¥([\d.]+)/);if(m)tAmt=parseFloat(m[1])||0;m=txt.match(/招¥([\d.]+)/);if(m)lAmt+=parseFloat(m[1])||0;m=txt.match(/转¥([\d.]+)/);if(m)lAmt+=parseFloat(m[1])||0;m=txt.match(/续¥([\d.]+)/);if(m)lAmt+=parseFloat(m[1])||0});if(!byTeacher[name])byTeacher[name]={teacher_name:name,amount:0,lesson_share:0,teaching_share:0,cycles:[]};byTeacher[name].amount+=amt;byTeacher[name].lesson_share+=lAmt;byTeacher[name].teaching_share+=tAmt;byTeacher[name].cycles.push(cyc)});
  var items=[];Object.values(byTeacher).forEach(function(t){items.push({teacher_name:t.teacher_name,cycle:t.cycles.join(', '),amount:Math.round(t.amount),lesson_share:Math.round(t.lesson_share),teaching_share:Math.round(t.teaching_share),source_share:0,detail:t.cycles.join(' + '),created_at:now})});
  fetch(API+'/settlements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch:true,items:items,created_at:now})}).then(function(r){return r.json()}).then(function(d){if(d.status==='ok'){alert('已生成 '+d.count+' 条跨月结算单');renderSettleTab()}else alert('生成失败')});
}
function deleteSettlement(id){if(confirm('删除?')){fetch(API+'/settlements/'+id,{method:'DELETE'}).then(function(){renderSettleTab()})}}

function savePrice(seg,ct,dt,price,mult){
  fetch(API+'/pricing',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({segment:seg,course_type:ct,discount_type:dt,unit_price:parseFloat(price),discount_multiplier:parseFloat(mult)})});
}

// ====== Excel 上传 ======
function uploadExcel(file){
  if(!file)return;
  var form=new FormData();form.append('file',file);
  var st=document.createElement('div');st.style.cssText='position:fixed;top:10px;right:10px;background:#fff;padding:12px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:9999;font-size:13px';
  st.textContent='导入中...';document.body.appendChild(st);
  fetch(API+'/import-excel',{method:'POST',body:form}).then(function(r){return r.json()}).then(function(d){
    if(d.status==='ok'){
      var s=d.stats;st.innerHTML='导入完成!<br>学生:'+s.student_ext+' 收费:新增'+s.purchases_new+' 更新'+s.purchases_updated+' 考勤:'+s.attendance+' 成本:'+s.costs+' 花名册:'+s.roster;
    }else{st.textContent='导入失败: '+d.message;st.style.color='var(--rd)'}
    setTimeout(function(){st.remove()},4000);
  }).catch(function(e){st.textContent='导入失败: '+e.message;st.style.color='var(--rd)';setTimeout(function(){st.remove()},4000)});
}
