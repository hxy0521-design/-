<!DOCTYPE html><html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>追光π · 思辨工作室</title><link rel="icon" href="/static/logo.png">
<style>
/* ====== Design Tokens ====== */
:root,[data-theme="light"]{
  --bg:#f0f2f8; --surface:#fff; --surface2:#f8f9fc;
  --border:#e8ecf4; --border2:#dde1ed;
  --tx:#2a2d3a; --tx2:#5a5f72; --tx3:#949aaf;

}
[data-theme="dark"]{
  --bg:#0f1119; --surface:#1a1d2b; --surface2:#222636;
  --border:#2a2e3e; --border2:#343a4e;
  --tx:#e8eaf0; --tx2:#a0a6bc; --tx3:#6b718a;
  --accent:#a78bfa; --accent2:#c4b5fd; --accent-light:#1e1b4b;
  --lime:#a3e635; --lime-light:#1a2e0a;
  --orange:#fdba74; --orange-light:#2d1a0a;
  --coral:#fda4af; --coral-light:#2d1118;
  --sky:#7dd3fc; --sky-light:#0c2d3e;
  --green:#4ade80; --green-light:#0a2e12;
  --amber:#fcd34d; --amber-light:#2d2006;
  --shadow:0 1px 3px rgba(0,0,0,.2); --shadow-md:0 4px 6px rgba(0,0,0,.25); --shadow-lg:0 10px 15px rgba(0,0,0,.3);
  --bl:var(--accent); --go:var(--lime); --rd:var(--coral); --sb:var(--tx3); --bd:var(--border); --p:var(--surface);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 var(--font);background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh;overflow:hidden;transition:background .3s,color .3s}
.pl{width:200px;min-width:200px;max-width:200px;padding:10px;border-right:1px solid var(--border);overflow-y:auto;background:var(--surface);transition:background .3s}
.pc{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface);transition:background .3s,width .3s}
.pr{width:420px;min-width:90px;padding:16px;border-left:1px solid var(--border);overflow-y:auto;background:var(--surface);transition:background .3s}
h2{font-size:15px;margin-bottom:8px;color:var(--accent);font-weight:700}h3{font-size:13px;margin:12px 0 6px;color:var(--tx2);font-weight:600}
.ci{padding:8px 12px;margin:3px 0;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;transition:all .2s;font-weight:500}.ci:hover{background:var(--accent-light);color:var(--accent)}
.li{font-size:11px;color:var(--tx2);padding:3px 0 3px 8px;cursor:pointer;border-radius:4px;transition:all .15s}.li:hover{color:var(--accent);background:var(--accent-light)}
.btn{padding:8px 16px;border-radius:var(--radius-xs);border:none;cursor:pointer;font-size:13px;margin:3px;transition:all .2s;font-weight:500;letter-spacing:.01em}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(0)}
.bp{background:var(--accent);color:#fff}.bp:hover{background:var(--accent2)}
.bg{background:var(--lime);color:#1a2e0a;font-weight:600}.bg:hover{background:#a3e635}
.bo{background:var(--surface);color:var(--tx2);border:1.5px solid var(--border)}.bo:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
input,textarea,select{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-xs);font:13px/1.5 var(--font);margin:3px 0;background:var(--bg);color:var(--tx);transition:border .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}

.mr{display:flex;gap:10px}.mr input{flex:1}
.tabs{display:flex;gap:0;padding:6px 16px 0;border-bottom:1.5px solid var(--border);min-height:36px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;cursor:pointer;font-size:12px;background:var(--surface2);border:1.5px solid var(--border);border-bottom:none;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;transition:all .2s;color:var(--tx2);margin-right:2px}.tab:hover{background:var(--accent-light)}

.kpi-u{font-size:13px;font-weight:500;color:var(--tx3);margin-left:3px}
.maintab{transition:all .2s;letter-spacing:.01em;font-family:var(--font)}
.maintab:hover{transform:translateY(-1px)}
.datatable{width:100%;border-collapse:collapse;font-size:12px;border-radius:var(--radius-sm);overflow:hidden}.datatable th{padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);color:var(--tx3);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;background:var(--surface2)}.datatable td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--tx2)}.datatable tbody tr{transition:background .15s}.datatable tbody tr:hover td{background:var(--accent-light)}
.section-card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);border:1.5px solid var(--border);transition:all .2s}

.section-title{font-size:15px;font-weight:700;color:var(--tx);margin:0 0 12px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.02em}
.tag-green{background:var(--green-light);color:var(--green)}.tag-yellow{background:var(--amber-light);color:var(--amber)}.tag-red{background:var(--coral-light);color:var(--coral)}.tag-blue{background:var(--sky-light);color:var(--sky)}

hr{border:none;border-top:1.5px dashed var(--border);margin:18px 0;opacity:.6}

</style></head><body>
<button class="theme-toggle" onclick="toggleTheme()" title="切换深色模式">🌙</button>
<div style="display:flex;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--surface)" id="topBar"><div id="mainTabs" style="display:flex;gap:4px;padding:4px 8px 0;overflow-x:auto;flex-shrink:0;"></div><div id="seasonDiv" style="display:flex;align-items:center;gap:0;padding:4px 12px 0;margin-left:auto"><button id="seasonBtnS" onclick="setSeason('S')" style="padding:3px 10px;border:1.5px solid var(--border);border-radius:6px 0 0 6px;font-size:11px;background:var(--surface);color:var(--tx2);cursor:pointer">春秋</button><button id="seasonBtnV" onclick="setSeason('V')" style="padding:3px 10px;border:1.5px solid var(--accent);border-left:none;border-radius:0 6px 6px 0;font-size:11px;background:var(--accent);color:#fff;cursor:pointer">寒暑</button></div></div></div><div style="display:flex;flex:1;overflow:hidden" id="mainRow"><div class="panel pl" style="display:none"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><label style="font-size:11px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="chkXinxin" onchange="onUserChange()" style="width:auto;margin:0 2px">只看欣欣</label><label style="font-size:11px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="chkBiscuit" onchange="onUserChange()" style="width:auto;margin:0 2px">只看饼干</label></div><h2>班级 <span style="font-size:10px;float:right"><a href="#" onclick="expandAll(event)" style="color:var(--sb)">展开</a> | <a href="#" onclick="collapseAll(event)" style="color:var(--sb)">折叠</a></span></h2><div id="classList"></div><button class="btn bo" style="margin-top:4px;width:100%" onclick="newUnitAll()">+ 新建单元</button><button class="btn bo" style="margin-top:4px;width:100%" onclick="newClass()">+ 新建班级</button><h3 style="margin-top:18px">输出文件</h3><div id="outputList"></div></div>
<div class="panel pc"><div class="tabs" id="tabBar"></div><div class="ed-body" id="editorBody"><div style="color:var(--sb);text-align:center;padding:60px 0">加载中...</div></div></div>
<div class="panel pr" id="previewPanel" style="display:none"><h2 style="cursor:pointer" onclick="togglePreview()"><span id="pvLabel">预览</span> <span id="pvHint" style="font-size:11px;color:var(--sb)">点击收起</span></h2><div id="previewContent" style="font-size:12px;color:var(--sb)">粘贴发言后在此预览</div></div>
<script>
function fv(v){return parseFloat(v)||0;}
function fv(v){return parseFloat(v)||0;}
var API=window.location.origin+'/api';
function toggleTheme(){var h=document.documentElement;var t=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',t);var btn=document.querySelector('.theme-toggle');btn.textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('theme',t)}
(function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);var btn=document.querySelector('.theme-toggle');if(btn)btn.textContent=t==='dark'?'☀️':'🌙'})();
var tabs={},activeTab=null,activeMainTab='overview',cfgReady=false;
// Event delegation for topic buttons (bypasses innerHTML onclick issues)
document.addEventListener('click',function(e){
  var btn=e.target.closest('button');if(!btn)return;
  var act=btn.getAttribute('data-act');if(!act)return;
  if(act==='format')formatTopic(parseInt(btn.getAttribute('data-idx')));
  else if(act==='addBullet')addBullets(parseInt(btn.getAttribute('data-idx')));
  else if(act==='removeBullet')removeBullets(parseInt(btn.getAttribute('data-idx')));
  else if(act==='formatAllBtn')formatAll();
  else if(act==='addBulletAllBtn')addBulletsAll();
  else if(act==='removeBulletAllBtn')removeBulletsAll();
});
var cache={};
function cachedFetch(url,force){return new Promise(function(resolve){if(!force&&cache[url])return resolve({json:function(){return Promise.resolve(cache[url])}});fetch(url).then(function(r){return r.json()}).then(function(d){cache[url]=d;resolve({json:function(){return Promise.resolve(d)}})})})}
function switchMainTab(){
  var el=document.getElementById('editorBody');if(!el)return;
  var sd=document.getElementById('seasonDiv');if(sd)sd.style.display=({overview:1,materials:1,edit:1,students:1}[activeMainTab])?'flex':'none';
  var pl=document.querySelector('.pl');var pr=document.getElementById('previewPanel');var tb=document.getElementById('tabBar');
  var isEdit=activeMainTab==='edit';
  if(pl)pl.style.display=isEdit?'block':'none';
  if(pr)pr.style.display=isEdit?'block':'none';
  if(tb)tb.style.display=isEdit?'':'none';
  if(!isEdit)document.querySelector('.pc').style.width='100%';
  el.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--sb)"><div style="display:inline-block;width:24px;height:24px;border:3px solid #e2e8f0;border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite"></div></div>';
  if(activeMainTab==='overview')renderOverviewTab();
  else if(activeMainTab==='materials')renderMaterialTab();
  else if(activeMainTab==='edit'){if(activeTab)renderEditor();else el.innerHTML='<div style=\"color:var(--sb);text-align:center;padding:60px 0\">请从左侧选择班级</div>'}
  else if(activeMainTab==='attendance'){renderAttendanceTab();setTimeout(function(){fetch(API+'/attendance/by-lesson?limit=1')},100)}
  else if(activeMainTab==='students')renderStudentTab();
  else if(activeMainTab==='payments')renderPaymentTab();
  else if(activeMainTab==='costs')renderCostTab();
	  else if(activeMainTab==='splits')renderRevenueSplitTab();
  else if(activeMainTab==='settle')renderSettleTab();
  else if(activeMainTab==='settle')renderSettleTab();
  else if(activeMainTab==='pricing')renderPricingTab();
  else el.innerHTML='<div style=\"color:var(--sb);text-align:center;padding:60px 0\">请从左侧选择班级</div>';
}
var _lastSaved='';
function renderMainTabs(){
  var tb=document.getElementById('mainTabs');if(!tb)return;
  var items=[{id:'overview',label:'总览'},{id:'materials',label:'素材'},{id:'edit',label:'编辑'},{id:'attendance',label:'消课'},{id:'students',label:'学生'},{id:'payments',label:'缴费'},{id:'costs',label:'成本'},{id:'splits',label:'分账'},{id:'settle',label:'结算'},{id:'pricing',label:'定价'}];
  tb.innerHTML='';
  items.forEach(function(it){
    var t=document.createElement('button');t.textContent=it.label;
    t.className='maintab';t.style.cssText='padding:6px 14px;border-radius:8px 8px 0 0;border:none;background:'+(activeMainTab===it.id?'var(--accent)':'transparent')+';color:'+(activeMainTab===it.id?'#fff':'var(--sb)')+';font-size:12px;cursor:pointer;font-weight:'+(activeMainTab===it.id?'600':'400');
    t.onclick=function(){switchTabWithCheck(it.id)};
    tb.appendChild(t);
  });
}
function saveSnapshot(d){return JSON.stringify({meta:d.meta||{},topics:(d.topics||[]).map(function(t){return{title:t.title,speeches:t.speeches}}),folder:d.folder||'',basePath:d.basePath||''})}
function hasUnsaved(){
  if(!activeTab||activeMainTab!=='edit')return false;
  var d=tabs[activeTab];if(!d)return false;
  if(!_lastSaved)return false;
  return saveSnapshot(d)!==_lastSaved;
}
function switchTabWithCheck(targetTab){
  if(activeMainTab==='edit'&&targetTab!=='edit'&&hasUnsaved()){
    var ov=document.createElement('div');ov.className="zg-modal-overlay";ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center';
    ov.innerHTML='<div style="background:var(--surface);border-radius:14px;padding:24px;max-width:380px;width:90%;box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center"><h3 style="margin:0 0 8px">未保存的修改</h3><div style="font-size:13px;color:var(--tx2);margin-bottom:20px">当前课节有未保存的内容，是否保存？</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn bp" style="padding:8px 20px" onclick="var btn=this;var ov=btn.closest(\'.zg-modal-overlay\');btn.textContent=\'保存中...\';btn.disabled=true;saveToServer();var check=setInterval(function(){var st=document.getElementById(\'saveStatus\');if(st&&st.textContent.indexOf(\'已保存\')>=0){clearInterval(check);btn.textContent=\'已保存\';setTimeout(function(){if(ov)ov.remove();_lastSaved=saveSnapshot(tabs[activeTab]||{});activeMainTab=\''+targetTab+'\';renderMainTabs();switchMainTab()},500)}},200)">保存</button><button class="btn bo" style="padding:8px 20px" onclick="var ov=this.closest(\'.zg-modal-overlay\');if(ov)ov.remove();activeMainTab=\''+targetTab+'\';renderMainTabs();switchMainTab()">放弃</button><button class="btn bo" style="padding:8px 20px" onclick="var ov=this.closest(\'.zg-modal-overlay\');if(ov)ov.remove()">取消</button></div></div>';
    document.body.appendChild(ov);
  }else{
    activeMainTab=targetTab;renderMainTabs();switchMainTab();
  }
}
function getCheckedUsers(){var u=[];if(document.getElementById('chkXinxin')&&document.getElementById('chkXinxin').checked)u.push('欣欣');if(document.getElementById('chkBiscuit')&&document.getElementById('chkBiscuit').checked)u.push('饼干');return u}
function onUserChange(){renderClassList()}

fetch(API+'/config').then(function(r){return r.json()}).then(function(d){
  if(!Object.keys(d).length){alert('欢迎！尚未配置班级，请点击左侧 + 新建班级 创建第一个班级。')}
  cfgReady=true;
}).catch(function(){});

function expandAll(e){e.preventDefault();document.querySelectorAll('#classList .ci').forEach(function(d){var u=d.nextElementSibling;if(u){u.style.display='block';u.querySelectorAll('div>div').forEach(function(l){l.style.display='block'})}})}
function collapseAll(e){e.preventDefault();document.querySelectorAll('#classList .ci').forEach(function(d){var u=d.nextElementSibling;if(u){u.style.display='none'}})}

function _classSortOrder(){
  // 排序：周一~周日 → 早~晚 → 启航<探索<先锋
  var dayOrder={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':7};
  var segOrder={'启航':1,'探索':2,'先锋':3};
  var clsSort={};
  (window._weekly||[]).forEach(function(w){
    var d=dayOrder[(w.weekday||'').slice(1)]||99;
    var t=parseInt((w.time||'0').replace(':',''))||0;
    var key=d*10000+t;
    if(!clsSort[w.class_name]||key<clsSort[w.class_name])clsSort[w.class_name]=key;
  });
  // Fallback: derive from class_time in config
  Object.keys(cfgInfo).forEach(function(cn){
    if(clsSort[cn])return;var units=cfgInfo[cn];if(!units)return;
    Object.values(units).forEach(function(u){var ct=u.class_time||'';if(ct){var parts=ct.split('/');var first=parts[0];var day=first.slice(0,2);var d=dayOrder[day.slice(1)]||99;var tm=first.slice(2);var t=parseInt((tm||'0').replace(':',''))||0;if(d<99)clsSort[cn]=d*10000+t}});
  });
  return Object.keys(cfgInfo).sort(function(a,b){
    var sa=clsSort[a]||999999,sb=clsSort[b]||999999;
    if(sa!==sb)return sa-sb;
    var sga=segOrder[a.slice(0,2)]||9,sgb=segOrder[b.slice(0,2)]||9;
    return sga-sgb;
  });
}
function renderClassList(){
  var el=document.getElementById('classList');el.innerHTML='';
  var filter=getCheckedUsers().length>0;
  // Build class list — 只展示有课节的班级，无内容的班级自动隐藏
  _classSortOrder().forEach(function(cls){
    var units=cfgInfo[cls];if(!Object.keys(units).length)return;
    if(filter){var hasMine=Object.values(units).some(function(u){return getCheckedUsers().indexOf(u.created_by)>=0});if(!hasMine)return}
    // 至少有一个单元有课节才展示（寒暑预排班级除外，允许空班展示）
    var hasLessons=Object.keys(units).some(function(uc){
      var ls=allLessons[cls]&&allLessons[cls][uc]?allLessons[cls][uc]:[];
      return ls.length>0;
    });
    if(!hasLessons&&!_isVac(cls))return;
    // Season filter — 春秋/寒暑班级隔离
    var ss=_seasonSet();if(!ss[cls])return;
    var d=document.createElement('div');d.className='ci';d.style.cssText='display:flex;align-items:center;cursor:pointer';

function handleImagePaste(e,topicIdx){
  console.log('paste event fired, topicIdx='+topicIdx);
  var items=e.clipboardData&&e.clipboardData.items;if(!items){console.log('no items');return}
  for(var i=0;i<items.length;i++){console.log('item['+i+']: '+items[i].type)}
  var hasImg=false;for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')===0){hasImg=true;break}}
  if(!hasImg)return;
  e.preventDefault();e.stopPropagation();
  var cur=tabs[activeTab];if(!cur||!cur.topics[topicIdx])return;
  if(!cur.topics[topicIdx]._images)cur.topics[topicIdx]._images=[];
  if(cur.topics[topicIdx]._images.length>=10){alert('每个话题最多10张图片');return}
  var blob=items[0].getAsFile(); // 取第一个图片
  for(var j=0;j<items.length;j++){if(items[j].type.indexOf('image')===0){blob=items[j].getAsFile();break}}
  var reader=new FileReader();
  reader.onload=function(ev){
    var cur2=tabs[activeTab];if(!cur2||!cur2.topics[topicIdx])return;
    if(!cur2.topics[topicIdx]._images)cur2.topics[topicIdx]._images=[];
    cur2.topics[topicIdx]._images.push(ev.target.result);
    console.log('paste img idx:',cur2.topics[topicIdx]._images.length-1,'total imgs:',cur2.topics[topicIdx]._images.length);
    var ta=document.querySelectorAll('#topicList .tb textarea')[topicIdx];
    if(ta){var marker='[img:'+(cur2.topics[topicIdx]._images.length-1)+']';var pos=ta.selectionStart;var text=ta.value;ta.value=text.substring(0,pos)+marker+' '+text.substring(pos);ta.selectionStart=ta.selectionEnd=pos+marker.length+1}
    saveTopics();var after=tabs[activeTab];console.log('after save, _images[0]=',after.topics[topicIdx]._images[0]?after.topics[topicIdx]._images[0].substring(0,30):'EMPTY');
    renderEditor();renderPreview()
  };
  reader.readAsDataURL(blob);
}

function _inheritSortOrder(){
  // 暑假继承排序：7月班先，8月班后；同月内按 启航1→探索1→启航2→探索2→先锋 交替
  var order=[];
  // 7月班
  var julys=['启航1班','探索1班','先锋1班','启航2班','探索2班','启航3班'];
  // 8月班 (2607&08)
  var augs=['启航4班','探索3班','启航5班','探索4班','先锋2班'];
  order=julys.concat(augs);
  return order;
}

function updateGenderPicker(){
var el=document.getElementById('genderPicker');if(!el)return;
var d=tabs[activeTab];if(!d)return;
var names=[];d.topics.forEach(function(t){(t.speeches||[]).forEach(function(s,j){if(names.indexOf(s.name)<0)names.push(s.name)})});
if(!names.length){el.innerHTML='';return}
var boys=[];
  // 快速路径：先从已保存的 d.meta.gender 解析（无需等异步加载）
  var gstr=d.meta.gender||'';
  if(gstr.indexOf('Male')===0){
    boys=gstr.replace('Male','').trim().split(/\s+/).filter(Boolean);
  }
  // 如果快速路径没拿到名字，从 student_ext 查
  if(!boys.length){
    var students=_cachedStudents;
    if(!students||!students.length){
      fetch(API+'/students').then(function(r){return r.json()}).then(function(rows){_cachedStudents=rows;updateGenderPicker();}).catch(function(){});
      // 即使缓存未加载，也能从无名格式推断全班性别
      if(gstr==='Male ') d.meta.gender='Male ';
      else if(gstr==='Female ') d.meta.gender='Female ';
      return;
    }
    var curClass=d.meta.class||'';
    names.forEach(function(n){
      // 匹配规则（跟考勤一样精确优先）：
      // 1. 精确匹配  2. student_ext去掉-数字后缀匹配（楠楠-5→楠楠）
      var match=function(s){
        if(s.student_name===n)return true;
        if(s.student_name.replace(/-\d+$/,'')===n)return true;
        return false;
      };
      // 优先匹配本班学生
      var se=students.find(function(s){return s.enrolled_class===curClass && match(s);});
      if(!se) se=students.find(match);
      if(se&&se.gender==='男')boys.push(n);
    });
  }
  // 全班同一性别时不列名字，否则列名字
  if(boys.length===names.length){
    d.meta.gender='Male ';
  }else if(boys.length===0){
    d.meta.gender='Female ';
  }else{
    d.meta.gender='Male '+boys.join(' ');
  }
// Deduplicate
var uniqBoys=[];boys.forEach(function(b){if(uniqBoys.indexOf(b)<0)uniqBoys.push(b);});
var uniqGirls=[];names.forEach(function(n){if(uniqBoys.indexOf(n)<0&&uniqGirls.indexOf(n)<0)uniqGirls.push(n);});
var h='<span style=\"font-size:11px;color:var(--sb)\">';
if(uniqBoys.length)h+='男：'+uniqBoys.join('、')+' ';
if(uniqGirls.length)h+='女：'+uniqGirls.join('、');
h+='</span>';
el.innerHTML=h;
}

function editMaterial(title){
  var cycle=document.getElementById('matCycle');var curCycle=cycle?cycle.value:'2607&08';
  showAddMaterialModal();
  setTimeout(function(){
    var c=document.getElementById('mfCycle');if(c)c.value=curCycle;
    var t=document.getElementById('mfTitle');if(t){t.value=title;t.readOnly=true;t.style.background='var(--border2)'}
    fetch(API+'/cycle-materials?cycle='+encodeURIComponent(curCycle)).then(function(r){return r.json()}).then(function(mats){
      var found=mats.filter(function(m){return m.title===title});
      if(!found.length)return;
      // Fill long image — collect segment → URL mapping
      var imgBySeg={};found.forEach(function(m){
        if(!m.class_image)return;
        if(typeof m.class_image==='string'){var s=m.segment||'';if(s)imgBySeg[s]=m.class_image}
        else{Object.keys(m.class_image).forEach(function(s){imgBySeg[s]=m.class_image[s]})}
      });
      // Fill each segment's long image field
      Object.keys(imgBySeg).forEach(function(s){var inp=document.querySelector('.mfImg[data-seg=\"'+s+'\"]');if(inp)inp.value=imgBySeg[s]});
      // Fill rec rows — sort by segment: 启航→探索→先锋
      var allRecs=[];found.forEach(function(m){m.golden_quotes.forEach(function(g){allRecs.push(g)})});
      var segOrder={'启航段':1,'探索段':2,'先锋段':3};
      allRecs.sort(function(a,b){var sa=segOrder[(a.segment||'').split(',')[0]]||9;var sb=segOrder[(b.segment||'').split(',')[0]]||9;return sa-sb});
      if(allRecs.length){
        document.getElementById('recRows').innerHTML='';
        allRecs.forEach(function(g){
          var rSegs=(g.segment||'').split(',').filter(function(s){return s});if(!rSegs.length)rSegs=['启航段','探索段','先锋段'];
          addRecRow(rSegs);var row=document.getElementById('recRows').lastChild;
          row.querySelector('.recName').value=g.name||'';row.querySelector('.recPath').value=g.path||'';
          row.querySelector('.recScore').value=g.score||'';row.querySelector('.recLine').value=g.line||'';
          if(g.path)setTimeout(function(){_showRecPreview(row,g.path)},100);
          rSegs.forEach(function(s){var cb=row.querySelector('.recSeg[value=\"'+s+'\"]');if(cb)cb.checked=true});
        });
      }
    });
  },300);
}

function loadPayments(){
  var search=document.getElementById('paySearch');var method=document.getElementById('payMethod');
  var ld=document.getElementById('payLoading');if(ld)ld.style.display='inline';
  var url=API+'/purchases?page='+payPage+'&limit=100';
  if(search&&search.value.trim())url+='&search='+encodeURIComponent(search.value.trim());
  if(method&&method.value)url+='&method='+encodeURIComponent(method.value);
  fetch(url).then(function(r){return r.json()}).then(function(d){
  if(ld)ld.style.display='none';
    var el=document.getElementById('payTable');var pg=document.getElementById('payPager');if(!el)return;
    var h='<div style="overflow-x:auto;border-radius:8px;border:1px solid #f1f5f9"><table class="datatable"><thead><tr><th>学生</th><th>分段</th><th>课型</th><th>方式</th><th>优惠</th><th>课次</th><th>金额</th><th>日期</th><th>订单号</th><th>备注</th><th></th></tr></thead><tbody>';
    d.rows.forEach(function(r){
    h+='<tr><td><b>'+esc(r.student_name)+'</b></td><td>'+esc(r.segment||'')+'</td><td>'+esc(r.course_type||'')+'</td><td>'+esc(r.method||'')+'</td><td>'+esc(r.discount_type||'')+'</td><td>'+r.lesson_count+'</td><td>¥'+(r.amount||0)+'</td><td style="font-size:11px">'+((r.actual_pay_date||'')?((r.actual_pay_date||'').slice(0,10)):'-')+'</td><td style="font-size:10px;color:var(--tx3)">'+esc(r.order_id||'')+'</td><td style="font-size:10px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(r.notes||'')+'">'+esc(r.notes||'')+'</td><td><button onclick="deletePay(\''+r.id+'\')" style="border:none;background:none;color:var(--rd);cursor:pointer;font-size:11px">删</button></td></tr>'});
    h+='</tbody></table></div>';el.innerHTML=h;
    var totalPages=Math.ceil(d.total/100);
    pg.innerHTML='<button onclick="payPage=Math.max(1,payPage-1);loadPayments()" style="padding:4px 10px;margin:0 2px">←</button><span style="font-size:12px;margin:0 8px">'+payPage+'/'+totalPages+' (共'+d.total+'条)</span><button onclick="payPage=Math.min('+totalPages+',payPage+1);loadPayments()" style="padding:4px 10px;margin:0 2px">→</button>';
  }).catch(function(){var ld=document.getElementById('payLoading');if(ld)ld.style.display='none';});
}
function closeModal(btn){var el=btn||event.target;while(el&&el!==document.body){if(el.style&&(el.style.position==='fixed'||el.style.zIndex==='9999')){el.remove();break}el=el.parentElement}}
function deletePay(id){if(!confirm('删除此缴费记录？'))return;fetch(API+'/finance/delete-purchase',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})}).then(function(r){return r.json()}).then(function(){loadPayments()})}

function renderCostTab(){
  var el=document.getElementById('editorBody');if(!el)return;
  el.innerHTML='<div style="text-align:center;padding:60px 0;color:var(--tx3)">加载中...</div>';
  fetch(API+'/finance/records?type=cost&limit=500').then(function(r){return r.json()}).then(function(rows){
    var h='<div style="padding:16px"><div style="display:flex;align-items:center;margin-bottom:12px"><h3 style="margin:0;flex:1">成本记录</h3><button class="btn bg" style="padding:4px 12px;font-size:11px" onclick="showAddCostModal()">+ 新增成本</button></div>';

      });

    var cycles=Object.keys(byCycle).sort().reverse();
    var cumNet=0; var cycleNet={};

function generateSingleCycleSettlement(cyc){
  var checked=document.querySelectorAll('input[data-cyc="'+cyc+'"]:checked');if(!checked.length){alert('请勾选至少一位教师');return}
  var now=new Date().toISOString().slice(0,10);var items=[];

function _isVac(cn){for(var i=0;i<_vacationWords.length;i++){if(cn.indexOf(_vacationWords[i])>=0)return true;}var units=cfgInfo[cn];if(units){var ucs=Object.keys(units);for(var j=0;j<ucs.length;j++){if(ucs[j]==='2607'||ucs[j]==='2608'||ucs[j]==='2607&08')return true;}}return false;}
function _segFromClass(cn){if(!cn)return'';if(cn.indexOf('启航')>=0)return'启航段';if(cn.indexOf('探索')>=0)return'探索段';if(cn.indexOf('先锋')>=0)return'先锋段';return''}
function setSeason(s){
  window._season=s;
  var btS=document.getElementById('seasonBtnS'),btV=document.getElementById('seasonBtnV');
  if(s==='S'){btS.style.background='var(--accent)';btS.style.color='#fff';btS.style.borderColor='var(--accent)';btV.style.background='var(--surface)';btV.style.color='var(--tx2)';btV.style.borderColor='var(--border)';}
  else{btV.style.background='var(--accent)';btV.style.color='#fff';btV.style.borderColor='var(--accent)';btS.style.background='var(--surface)';btS.style.color='var(--tx2)';btS.style.borderColor='var(--border)';}
  var sm=document.getElementById('summerMonthToggle');if(sm)sm.style.display=s==='V'?'inline':'none';
  if(activeMainTab==='overview')renderOverviewTab();
  if(activeMainTab==='edit'){renderClassList();if(activeTab)renderEditor();}
  if(activeMainTab==='students')renderStudentTab();
  renderMainTabs();switchMainTab();
}
function setSummerMonth(m){
  window._summerMonth=m;
  if(activeMainTab==='overview')renderOverviewTab();
  if(activeMainTab==='edit'){renderClassList();if(activeTab)renderEditor();}
  if(activeMainTab==='students')renderStudentTab();
}
function _seasonSet(){
  var s={};Object.keys(cfgInfo).forEach(function(cn){
    var v=_isVac(cn);
    if(window._season==='V'){if(!v)return;var units=cfgInfo[cn];if(!units)return;if(units['2607&08']){s[cn]=true;return;}if(window._summerMonth==='2607'&&!units['2607'])return;if(window._summerMonth==='2608'&&!units['2608'])return;s[cn]=true;}
    else{if(!v)s[cn]=true;}
  });return s;
}
function _seasonFilter(weekly){var ss=_seasonSet();return weekly.filter(function(w){return ss[w.class_name];});}

// ── 预排弹窗 ──
var _pfTopics=['高考作文','情感投射','城市规划','算法审美'];
var _topicNums={高考作文:'一',情感投射:'二',城市规划:'三',算法审美:'四'};
function _pfDisplay(s){
  if(s.is_trial)return esc(s.student_name)+'(试)';
  var ts=s.topics||[];
  if(ts.length===4)return esc(s.student_name)+'(全)';
  if(ts.length>0){var ns=ts.map(function(t){return _topicNums[t]||t});return esc(s.student_name)+'('+ns.join('')+')';}
  return esc(s.student_name);
}
function showPrefillModal(cls){
  var ov=document.createElement('div');ov.className='zg-modal-overlay';ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center';
  var h='<div style="background:var(--surface);border-radius:12px;padding:20px;max-width:520px;width:90%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)"><h3>预排 — '+esc(cls)+'</h3>'
    +'<div id="pfCurrList" style="margin-bottom:12px;font-size:12px">加载中...</div>'
    +'<div style="border-top:1px solid var(--border);padding-top:10px;margin-top:10px"><div style="font-size:11px;color:var(--tx3);margin-bottom:4px">添加学生</div>'
    +'<div style="display:flex;gap:4px;margin:4px 0"><input id="pfName" placeholder="姓名" style="flex:1;padding:6px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:12px"><input id="pfLessons" type="number" value="1" min="1" max="8" style="width:50px;padding:6px;border:1.5px solid var(--border);border-radius:6px;font-size:12px"><span style="font-size:11px;line-height:32px">节</span></div>'
    +'<div style="margin:6px 0"><label style="font-size:12px;cursor:pointer"><input type="checkbox" id="pfTrial" style="width:auto" onchange="if(this.checked)document.getElementById(&apos;pfLessons&apos;).value=1"> 试听生（单节）</label></div>'
    +'<div style="margin:6px 0"><div style="font-size:11px;color:var(--tx3);margin-bottom:2px">专题选择</div><div style="display:flex;flex-wrap:wrap;gap:6px">';
  h+='<label style="font-size:11px;cursor:pointer"><input type="checkbox" id="pfAllTopics" onchange="var cbs=document.querySelectorAll(\'.pfTopicCb\');var checked=this.checked;cbs.forEach(function(cb){cb.checked=checked});var cnt=checked?4:0;if(cnt>0&&!document.getElementById(\'pfTrial\').checked)document.getElementById(\'pfLessons\').value=cnt*2;else if(cnt===0)document.getElementById(\'pfLessons\').value=1" style="width:auto"> 全选</label>';_pfTopics.forEach(function(t,i){h+='<label style="font-size:11px;cursor:pointer"><input type="checkbox" class="pfTopicCb" value="'+t+'" style="width:auto" onchange="var cnt=document.querySelectorAll(&apos;.pfTopicCb:checked&apos;).length;if(cnt>0&&!document.getElementById(&apos;pfTrial&apos;).checked)document.getElementById(&apos;pfLessons&apos;).value=cnt*2"> '+t+'</label>';});
  h+='</div></div>'
    +'<button class="btn bg" style="padding:4px 14px;font-size:11px;margin-top:6px" onclick="addPrefillStudent(\''+cls+'\')">添加</button></div>'
    +'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn bp" style="padding:6px 14px;font-size:12px;margin-right:auto" onclick="confirmPrefill(\''+cls+'\')">确认开班</button><button onclick="closeModal(this)" class="btn bo" style="padding:6px 14px">关闭</button></div></div>';
  ov.innerHTML=h;document.body.appendChild(ov);loadPrefillList(cls);
}
function loadPrefillList(cls){
  fetch(API+'/prefill/'+encodeURIComponent(cls)).then(function(r){return r.json()}).then(function(data){
    var el=document.getElementById('pfCurrList');if(!el)return;
    if(!data||!data.length){el.innerHTML='<div style="color:var(--tx3)">暂无预排学生</div>';return}
    var h='<div style="font-size:11px;color:var(--tx3);margin-bottom:4px">当前预排 <b>'+data.length+'</b>人</div>';
    data.forEach(function(s){
      h+='<div style="display:flex;align-items:center;padding:5px 8px;margin:2px 0;background:var(--surface2);border-radius:4px;font-size:11px">'
        +'<span style="flex:1"><b>'+_pfDisplay(s)+'</b> ×'+s.lesson_count+'节</span>'
        +'<button data-pf-cls="'+esc(cls)+'" data-pf-name="'+esc(s.student_name)+'" onclick="var b=this;deletePrefill(b.getAttribute(\'data-pf-cls\'),b.getAttribute(\'data-pf-name\'))" style="border:none;background:none;color:var(--rd);cursor:pointer;font-size:14px;padding:0 4px">×</button></div>';
    });el.innerHTML=h;
  });
}
function addPrefillStudent(cls){
  var nm=document.getElementById('pfName');if(!nm||!nm.value.trim())return;
  var name=nm.value.trim(),lessons=parseInt(document.getElementById('pfLessons').value)||1;
  var isTrial=document.getElementById('pfTrial').checked?1:0;if(isTrial)lessons=1;
  var topics=[];document.querySelectorAll('.pfTopicCb:checked').forEach(function(cb){topics.push(cb.value)});
  fetch(API+'/prefill/'+encodeURIComponent(cls)).then(function(r){return r.json()}).then(function(data){
    var found=false;data.forEach(function(s){if(s.student_name===name){s.lesson_count=lessons;s.is_trial=isTrial;s.topics=topics;found=true;}});
    if(!found)data.push({student_name:name,lesson_count:lessons,is_trial:isTrial,topics:topics});
    return fetch(API+'/prefill/'+encodeURIComponent(cls),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  }).then(function(r){return r.json()}).then(function(){
    nm.value='';document.getElementById('pfLessons').value='1';
    document.getElementById('pfTrial').checked=false;
    document.querySelectorAll('.pfTopicCb').forEach(function(cb){cb.checked=false});
    loadPrefillList(cls);
  });
}
function deletePrefill(cls,name){
  fetch(API+'/prefill/'+encodeURIComponent(cls)).then(function(r){return r.json()}).then(function(data){
    var filtered=data.filter(function(s){return s.student_name!==name});
    return fetch(API+'/prefill/'+encodeURIComponent(cls),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(filtered)});
  }).then(function(r){return r.json()}).then(function(){loadPrefillList(cls);});
}
function confirmPrefill(cls){
  if(!confirm('确认开班后，预排学生将加入花名册。\\n\\n确定吗？'))return;
  fetch(API+'/prefill/'+encodeURIComponent(cls)+'/confirm',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
    if(d.status==='ok'){alert('已确认开班！'+d.added+'名学生加入花名册');closeModal();if(activeMainTab==='overview')renderOverviewTab();}
    else alert(d.message||'确认失败');
  });
}
var _weekNotes={};
function saveWeekNote(inp){var cls=inp.getAttribute('data-cls');if(cls)_weekNotes[cls]=inp.value;}

function lockSplits(){
  if(!confirm('锁定后，刷新数据不会重置已设定的教研系数。\n\n确定锁定当前所有系数吗？'))return;
  fetch(API+'/revenue-splits/lock',{method:'POST'}).then(function(r){return r.json()}).then(function(d){
    alert('已锁定 '+d.locked+' 条系数！刷新数据不会重置。');
  });
}

function checkTopicQMarks(){
  var hasQM=false,names=[];
  document.querySelectorAll("#topicList .tb input").forEach(function(inp){
    var v=inp.value||"";
    if(v.indexOf(":")>=0||v.indexOf("：")>=0){hasQM=true;names.push(v);inp.style.borderColor="var(--rd)";inp.style.background="#fff5f5";}
    else{inp.style.borderColor="";inp.style.background="";}
  });
  var gw=document.getElementById("genWarn");
  if(gw){gw.innerHTML=hasQM?"<span style=\"color:var(--rd)\">⚠ 标题含冒号："+names.join("、")+"（影响素材生成，请修改）</span>":"";}
}

</script></body></html>
