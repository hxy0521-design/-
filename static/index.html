<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>追光π</title><link rel="icon" href="/static/logo.png">
<style>
:root{--bg:#f5f3ee;--p:#fff;--bd:#ddd;--bl:#4a6fa5;--go:#c8953a;--rd:#b5452a;--tx:#333;--sb:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.6 -apple-system,system-ui;background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}
.pl{width:200px;min-width:200px;max-width:200px;padding:8px;border-right:1px solid var(--bd);overflow-y:auto;background:var(--p);height:100vh}
.pc{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--p);height:100vh}
.pr{width:420px;padding:14px;border-left:1px solid var(--bd);overflow-y:auto;background:var(--p);height:100vh}
h2{font-size:15px;margin-bottom:8px;color:var(--bl)}h3{font-size:13px;margin:12px 0 6px;color:var(--sb)}
.ci{padding:7px 10px;margin:3px 0;border-radius:6px;cursor:pointer;font-size:13px}.ci:hover{background:#f0ede5}
.li{font-size:11px;color:var(--sb);padding:2px 0;cursor:pointer}.li:hover{color:var(--bl)}
.btn{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:13px;margin:3px}
.bp{background:var(--bl);color:#fff}.bg{background:var(--go);color:#fff}.bo{background:none;border:1px solid var(--bd)}
input,textarea,select{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:4px;font:13px/1.5 system-ui;margin:3px 0}
textarea{min-height:120px;font-family:monospace;resize:vertical}
.mr{display:flex;gap:8px}.mr input{flex:1}
.tabs{display:flex;gap:2px;padding:6px 14px 0;border-bottom:1px solid var(--bd);min-height:36px}
.tab{padding:6px 12px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;background:#eee;border:1px solid var(--bd);border-bottom:none;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.tab.ac{background:var(--p);border-bottom:1px solid var(--p);margin-bottom:-1px;font-weight:600}
.tab .close{margin-left:6px;font-size:12px;opacity:.5;cursor:pointer}.tab .close:hover{opacity:1;color:var(--rd)}
.ed-body{flex:1;overflow-y:auto;padding:14px 18px}
.tb{background:#faf8f4;border:1px solid var(--bd);border-radius:8px;padding:10px;margin:6px 0}
.tt{font-weight:600;color:var(--bl);margin-bottom:6px;display:flex;gap:6px;align-items:center;cursor:pointer}
.tt input{flex:1;margin:0}.tt span{flex-shrink:0}
.sa{min-height:60px;margin:4px 0;font-size:12px}.sa.collapsed{display:none}
.st{font-size:12px;color:var(--sb);margin:6px 0}
.op{padding:8px;margin:4px 0;border-radius:6px;background:#faf8f4;border:1px solid var(--bd);font-size:12px}.op a{color:var(--bl)}
.pt{white-space:pre-wrap;font-size:12px;background:#faf8f4;padding:14px;border-radius:8px;border:1px solid var(--bd);line-height:1.6;text-align:left}
</style></head><body>
<div class="panel pl"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><label style="font-size:11px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="chkXinxin" onchange="onUserChange()" style="width:auto;margin:0 2px">只看欣欣</label><label style="font-size:11px;cursor:pointer;white-space:nowrap"><input type="checkbox" id="chkBiscuit" onchange="onUserChange()" style="width:auto;margin:0 2px">只看饼干</label></div><h2>班级 <span style="font-size:10px;float:right"><a href="#" onclick="expandAll(event)" style="color:var(--sb)">展开</a> | <a href="#" onclick="collapseAll(event)" style="color:var(--sb)">折叠</a></span></h2><div id="classList"></div><button class="btn bo" style="margin-top:4px;width:100%" onclick="newUnitAll()">+ 新建单元</button><button class="btn bo" style="margin-top:4px;width:100%" onclick="newClass()">+ 新建班级</button><h3 style="margin-top:18px">输出文件</h3><div id="outputList"></div></div>
<div class="panel pc"><div class="tabs" id="tabBar"></div><div class="ed-body" id="editorBody"><div style="color:var(--sb);text-align:center;padding:60px 0">请从左侧选择班级</div></div></div>
<div class="panel pr" id="previewPanel"><h2 style="cursor:pointer" onclick="togglePreview()"><span id="pvLabel">预览</span> <span id="pvHint" style="font-size:11px;color:var(--sb)">点击收起</span></h2><div id="previewContent" style="font-size:12px;color:var(--sb)">粘贴发言后在此预览</div></div>
<script>
var API=window.location.origin+'/api';
var tabs={},activeTab=null,cfgReady=false;

function getCheckedUsers(){var u=[];if(document.getElementById('chkXinxin')&&document.getElementById('chkXinxin').checked)u.push('欣欣');if(document.getElementById('chkBiscuit')&&document.getElementById('chkBiscuit').checked)u.push('饼干');return u}
function onUserChange(){renderClassList()}

fetch(API+'/config').then(function(r){return r.json()}).then(function(d){
  if(!Object.keys(d).length){alert('欢迎！尚未配置班级，请点击左侧 + 新建班级 创建第一个班级。')}
  cfgReady=true;
}).catch(function(){});

function expandAll(e){e.preventDefault();document.querySelectorAll('#classList .ci').forEach(function(d){var u=d.nextElementSibling;if(u){u.style.display='block';u.querySelectorAll('div>div').forEach(function(l){l.style.display='block'})}})}
function collapseAll(e){e.preventDefault();document.querySelectorAll('#classList .ci').forEach(function(d){var u=d.nextElementSibling;if(u){u.style.display='none'}})}

function renderClassList(){
  var el=document.getElementById('classList');el.innerHTML='';
  var filter=getCheckedUsers().length>0;
  // Build class list from cfgInfo + allLessons (loaded once via /api/config)
  Object.keys(cfgInfo).forEach(function(cls){
    var units=cfgInfo[cls];if(!Object.keys(units).length)return;
    if(filter){var hasMine=Object.values(units).some(function(u){return getCheckedUsers().indexOf(u.created_by)>=0});if(!hasMine)return}
    var d=document.createElement('div');d.className='ci';d.style.cssText='display:flex;align-items:center;cursor:pointer';
    d.onclick=function(e){if(e.target.tagName==='BUTTON')return;var ul=this.nextElementSibling;if(ul)ul.style.display=ul.style.display==='none'?'block':'none';var first=ul&&ul.querySelector('.li');if(first)first.click()};
    var cnSpan=document.createElement('span');cnSpan.textContent=cls;cnSpan.style.flex='1';
    d.appendChild(cnSpan);
    var trashBtn=document.createElement('button');trashBtn.innerHTML='<svg width=\"12\" height=\"14\" viewBox=\"0 0 12 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"><path d=\"M1 3h10M4 3V2a1 1 0 011-1h2a1 1 0 011 1v1M2 3v10a1 1 0 001 1h6a1 1 0 001-1V3M4.5 6v5M7.5 6v5\"/></svg>';trashBtn.title='删除班级';
    trashBtn.style.cssText='border:none;background:none;cursor:pointer;color:var(--sb);padding:0 2px;opacity:.4;flex-shrink:0';
    trashBtn.onclick=function(e){e.stopPropagation();deleteClass(cls,units)};
    d.appendChild(trashBtn);
    el.appendChild(d);
    var unitDiv=document.createElement('div');unitDiv.style.cssText='display:none;padding-left:4px';
    var unitKeys=Object.keys(units);
    unitKeys.forEach(function(un,idx){
      var uname=(units[un]&&units[un].name)||un;
      var isLast=(idx===unitKeys.length-1);
      var uh=document.createElement('div');
      uh.style.cssText='font-size:12px;color:var(--go);padding:2px 0;cursor:pointer;display:flex;align-items:center;position:relative';
      uh.innerHTML='<span style="flex:1">'+uname+'</span>';
      var trashBtn2=document.createElement('button');trashBtn2.innerHTML='<svg width=\"12\" height=\"14\" viewBox=\"0 0 12 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"><path d=\"M1 3h10M4 3V2a1 1 0 011-1h2a1 1 0 011 1v1M2 3v10a1 1 0 001 1h6a1 1 0 001-1V3M4.5 6v5M7.5 6v5\"/></svg>';trashBtn2.title='删除单元';
      trashBtn2.style.cssText='border:none;background:none;cursor:pointer;color:var(--sb);padding:0 3px;position:absolute;right:22px;opacity:.4';
      trashBtn2.onclick=function(e){e.stopPropagation();deleteUnit(cls,un,uname)};
      uh.appendChild(trashBtn2);
      var addBtn=document.createElement('button');addBtn.textContent='+';addBtn.title='新建课节';
      addBtn.style.cssText='border:none;background:none;cursor:pointer;font-size:14px;color:var(--sb);padding:0 2px;position:absolute;right:8px';
      addBtn.onclick=function(e){e.stopPropagation();newLesson(cls,un,uname)};
      uh.appendChild(addBtn);
      uh.onclick=function(e){e.stopPropagation();var ul=this.nextElementSibling;if(ul)ul.style.display=ul.style.display==='none'?'block':'none'};
      unitDiv.appendChild(uh);
      var ldiv=document.createElement('div');ldiv.style.cssText='padding-left:0px;'+(isLast?'':'display:none');
      var lessons=allLessons[cls]&&allLessons[cls][un]?allLessons[cls][un]:[];
      lessons.forEach(function(l){
        var li=document.createElement('div');li.className='li';
        var dt=(l.date||'');var shortDt=dt.length>=10?dt.slice(5).replace(/-/g,''):dt;
        li.textContent=(l.title||'')+'-'+shortDt;
        if(l.folder){li.onclick=function(e){e.stopPropagation();loadAndOpen(l.folder,cls)}}else{li.style.opacity='.4';li.style.cursor='default';li.textContent='请先建课节'}
        ldiv.appendChild(li);
      });
      unitDiv.appendChild(ldiv);
    });
    el.appendChild(unitDiv);
  });
}
var cfgInfo={},allLessons={},zgUser='';
function fetchConfig(){fetch(API+'/config').then(function(r){return r.json()}).then(function(d){cfgInfo=d.classes||d;allLessons=d.lessons||{};zgUser=d.zg_user||'';renderClassList()}).catch(function(){})}
fetchConfig();

function newClass(){
  var n=prompt('班级名称（如 周一探索）:');if(!n)return;
  var t=prompt('上课时间（如 19:30）:');if(t===null)return;
  fetch(API+'/classes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,created_by:getCheckedUsers()[0]||'',class_time:t})})
    .then(function(r){return r.json()}).then(function(d){if(d.status==='ok'){fetchConfig()}else alert(d.message)})
    .catch(function(){alert('创建班级失败')});
}
function deleteClass(cls, units){
  var hasContent=Object.values(units).some(function(ls){return ls.length>0&&ls[0].folder});
  var msg='确定删除班级 「'+cls+'」？';
  if(hasContent)msg+='\n\n该班级有课节内容，所有单元和课节文件夹将移入回收站。';
  if(!confirm(msg))return;
  fetch(API+'/classes/'+encodeURIComponent(cls),{method:'DELETE'}).then(function(r){return r.json()}).then(function(d){if(d.status==='ok')location.reload();else alert(d.message)}).catch(function(){alert('删除失败')});
}
function deleteUnit(cls, code, name){
  if(!confirm('确定删除 「'+name+'」('+code+') 从 '+cls+'？\n\n课节文件夹将移入回收站。'))return;
  fetch(API+'/classes/'+encodeURIComponent(cls)+'/units/'+code,{method:'DELETE'}).then(function(r){return r.json()}).then(function(d){if(d.status==='ok')location.reload();else alert(d.message)}).catch(function(){alert('删除失败')});
}
function newUnitAll(){
  fetch(API+'/config').then(function(r){return r.json()}).then(function(raw){
    var cfg=raw.classes||raw;var clsList=Object.keys(cfg);
    if(!clsList.length){alert('请先点击 + 新建班级 创建班级');return}
    var input=prompt('新建单元（如 2605 无形的手）：','');if(!input)return;
    var parts=input.split(/\s+/);var code=parts[0];var name=parts.slice(1).join(' ')||code;
    if(!code)return;
    if(!confirm('请选择 「'+name+'」('+code+') 课后素材的存放文件夹\n\n点「确定」打开文件夹选择器'))return;
    fetch(API+'/pick-folder').then(function(r){return r.json()}).then(function(d){
      if(!d.path){alert('未选择文件夹，已取消。');return}
      var done=0;
      clsList.forEach(function(cls){
        fetch(API+'/classes/'+encodeURIComponent(cls)+'/units',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,name:name,path:d.path,created_by:getCheckedUsers()[0]||''})})
          .then(function(r){return r.json()}).then(function(r2){
            done++;if(done===clsList.length){fetchConfig()};
          }).catch(function(){done++;if(done===clsList.length){fetchConfig()}});
      });
    });
  });
}
function newUnit(cls, unitCode, unitFull){
  var input=prompt('为 '+cls+' 新建单元（如 2605 无形的手）：','2606');if(!input)return;
  var parts=input.split(/\s+/);var code=parts[0];var name=parts.slice(1).join(' ')||code;
  if(!confirm('请选择 「'+name+'」('+code+') 课后素材的存放文件夹\n\n点「确定」打开文件夹选择器'))return;
  fetch(API+'/pick-folder').then(function(r){return r.json()}).then(function(d){
    if(!d.path){alert('未选择文件夹，已取消。');return}
    fetch(API+'/classes/'+encodeURIComponent(cls)+'/units',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,name:name,path:d.path,created_by:getCheckedUsers()[0]||''})})
      .then(function(r){return r.json()}).then(function(r2){if(r2.status==='ok')location.reload();else alert(r2.message)})
      .catch(function(){alert('创建单元失败')});
  });
}
function newLesson(cls,unit,unitFull){
  var uname=unitFull||unit;var tabName=cls+'-'+unit+'-new';
  if(!tabs[tabName])tabs[tabName]={meta:{title:'',unit:'',date:'',class:cls,gender:''},topics:[],_golden:{}};
  var d=tabs[tabName];d.meta.date=new Date().toISOString().slice(0,10);d.meta.unit=uname;d.meta.class=cls;d.folder='';
  fetch(API+'/config').then(function(r){return r.json()}).then(function(cfg){
    var u=cfg[cls]&&cfg[cls][unit];if(u&&u.path)d.basePath=u.path;
    activeTab=tabName;renderTabs();renderEditor();renderPreview();
  });
}

function openTab(cls){if(!tabs[cls])tabs[cls]={meta:{title:'',unit:'',date:'',class:cls,gender:''},topics:[],_golden:{}};activeTab=cls;renderTabs();renderEditor();renderPreview()}
function closeTab(cls,e){e.stopPropagation();delete tabs[cls];if(activeTab===cls)activeTab=Object.keys(tabs)[0]||null;renderTabs();if(activeTab){renderEditor();renderPreview()}else{document.getElementById('editorBody').innerHTML='<div style="color:var(--sb);text-align:center;padding:60px 0">请从左侧选择班级</div>';document.getElementById('previewContent').innerHTML='<span class="st">粘贴发言后在此预览</span>';document.getElementById('outputList').innerHTML=''}}
function renderOutputs(outputs){var ol=document.getElementById('outputList');ol.innerHTML='';(outputs||[]).forEach(function(o){var op=document.createElement('div');op.className='op';if(o.path){var isPng=o.name&&o.name.toLowerCase().endsWith('.png');if(isPng){op.innerHTML='<a href="#" onclick="showPreviewImage(\''+o.path+'\',\''+esc(o.name)+'\');return false">'+o.name+'</a>'}else{op.innerHTML='<a href="'+o.path+'" target="_blank">'+o.name+'</a>'}}else{op.textContent=o.name}ol.appendChild(op)})}
function loadAndOpen(folder,cls){fetch(API+'/load/'+folder).then(function(r){return r.json()}).then(function(d){
d.topics.forEach(function(t,i){t._images=(d.images&&d.images[i])?d.images[i].slice():[]});tabs[cls]={meta:d.meta||{},topics:d.topics||[],_golden:{},folder:folder,basePath:d.base_path||''};activeTab=cls;renderTabs();renderEditor();renderPreview();renderOutputs(d.outputs||[])}).catch(function(e){alert('加载失败')})}
function renderTabs(){var tb=document.getElementById('tabBar');tb.innerHTML='';Object.keys(tabs).forEach(function(cls){var t=document.createElement('div');t.className='tab'+(cls===activeTab?' ac':'');t.innerHTML=cls+'<span class="close" onclick="closeTab(\''+cls+'\',event)"> x</span>';t.onclick=function(){activeTab=cls;renderTabs();renderEditor();renderPreview()};tb.appendChild(t)})}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ge(id){var e=document.getElementById(id);return e?e.value:''}
function saveMeta(){if(!activeTab)return;var d=tabs[activeTab];d.meta.title=ge('etTitle');d.meta.unit=ge('etUnit');d.meta.date=ge('etDate');d.meta.class=ge('etClass')||activeTab}

function parseSpeechRaw(raw,topicTitle){var ss=[],allTitles=[];document.querySelectorAll('#topicList .tb').forEach(function(b){var t=b.querySelector('input');if(t&&t.value)allTitles.push(t.value)});var nlSep=(zgUser==='饼干')?'':'\n';raw.split('\n').forEach(function(line){// 先把所有 [img:N] 提到行首
var imgTags='';line=line.replace(/\[img:\d+\]/g,function(m){imgTags+=m+' ';return''}).trim();line=imgTags+line;
var m=line.match(/^(\[img:\d+\]\s*)*\s*([^:：]+)[：:](.*)$/);if(m){var nm=m[2].trim();nm=nm.replace(/\[img[^\]]*\]?/g,'').trim();if(!nm||nm.length>8)return;if(nm===topicTitle)return;if(allTitles.some(function(t){return t.indexOf(nm+':')===0}))return;var cont=(imgTags+m[3].trim()).trim();ss.push({name:nm,content:cont})}else if(imgTags.trim()&&!line.replace(/^(\[img:\d+\]\s*)+$/,'').trim()){if(ss.length)ss[ss.length-1].content+=' '+imgTags.trim();else ss.push({name:'',content:imgTags.trim()})}else if(line.trim()&&ss.length)ss[ss.length-1].content+=nlSep+line.trim()});return ss}
function saveTopics(){if(!activeTab)return;var old=tabs[activeTab].topics||[];var ts=[];document.querySelectorAll('#topicList .tb').forEach(function(b,bi){var t=b.querySelector('input'),ta=b.querySelector('textarea');var title=t?t.value:'',raw=ta?ta.value:'';ts.push({title:title,speeches:parseSpeechRaw(raw,title),_raw:raw,_images:(old[bi]&&old[bi]._images)||[]})});tabs[activeTab].topics=ts}
function addBullets(topicIdx){var ta=document.querySelectorAll('#topicList .tb textarea')[topicIdx];if(!ta)return;var lines=ta.value.split('\n');var isXinxin=zgUser==='欣欣';for(var i=0;i<lines.length;i++){var ln=lines[i];var m=ln.match(/^([^：:]+[：:])\s*(.*)/);if(m&&m[2]&&!m[2].startsWith('- ')){lines[i]=m[1]+'- '+m[2]}else if(!isXinxin&&ln.trim()&&!ln.match(/^[^：:]+[：:]/)&&!ln.trim().startsWith('- ')){lines[i]='- '+ln.trim()}}ta.value=lines.join('\n');saveTopics();renderPreview()}
function insertTopicAfter(idx){if(!activeTab)return;var pos=idx<0?0:idx+1;tabs[activeTab].topics.splice(pos,0,{title:'',speeches:[],_raw:''});renderEditor();renderPreview()}

function renderTopics(){var d=tabs[activeTab];if(!d)return'';var h='<div style="text-align:center;margin:4px 0"><button class="btn bo" style="padding:2px 20px;font-size:11px;opacity:.6" onclick="insertTopicAfter(-1)">+ 插入到顶部</button></div>';d.topics.forEach(function(t,i){var count=(t.speeches||[]).length;h+='<div class="tb"><div class="tt" onclick="this.nextElementSibling.classList.toggle(\'collapsed\')"><span>'+(i+1)+'.</span><input value="'+esc(t.title)+'" onchange="saveTopics();event.stopPropagation()" placeholder="话题" onclick="event.stopPropagation()" />';if(count>0)h+='<span style="font-size:10px;color:var(--sb)">('+count+')</span>';h+='<button class="btn bo" style="padding:2px 6px;font-size:11px;margin-left:auto" onclick="event.stopPropagation();this.closest(\'.tb\').remove();saveTopics();renderPreview()">x</button></div><div style="display:flex;gap:4px;align-items:flex-start"><button class="btn bo" style="padding:1px 5px;font-size:9px;opacity:.5" onclick="addBullets('+i+')" title="每段发言前加 - ">- -</button><textarea class="sa" placeholder="粘贴发言（姓名：内容）  可粘贴截图 Ctrl+V" oninput="saveTopics();renderPreview()" onpaste="handleImagePaste(event,'+i+')" onclick="event.stopPropagation()">'+(t._raw||(t.speeches||[]).map(function(s){return s.name+':'+s.content}).join('\n'))+'</textarea></div>';var imgs=(t._images||[]);if(imgs.length){h+='<div class="topicImages" style="display:flex;gap:4px;flex-wrap:wrap;padding:4px 0">';imgs.forEach(function(img,idx){h+='<div style="position:relative"><img src="'+img+'" style="max-height:80px;border-radius:4px;border:1px solid var(--bd)"><span style="position:absolute;top:0;right:2px;cursor:pointer;font-size:12px;color:var(--rd)" onclick="removeTopicImage('+i+','+idx+')">x</span></div>'});h+='</div>'}h+='</div>';h+='<div style="text-align:center;margin:4px 0"><button class="btn bo" style="padding:2px 20px;font-size:11px;opacity:.6" onclick="insertTopicAfter('+i+')">+ 在此后插入</button></div>'});return h}

function handleImagePaste(e,topicIdx){
  console.log('paste event fired, topicIdx='+topicIdx);
  var items=e.clipboardData&&e.clipboardData.items;if(!items){console.log('no items');return}
  for(var i=0;i<items.length;i++){console.log('item['+i+']: '+items[i].type)}
  var hasImg=false;for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')===0){hasImg=true;break}}
  if(!hasImg)return;
  e.preventDefault();e.stopPropagation();
  var cur=tabs[activeTab];if(!cur||!cur.topics[topicIdx])return;
  if(!cur.topics[topicIdx]._images)cur.topics[topicIdx]._images=[];
  if(cur.topics[topicIdx]._images.length>=10){alert('每个话题最多10张图片');return}
  var blob=items[0].getAsFile(); // 取第一个图片
  for(var j=0;j<items.length;j++){if(items[j].type.indexOf('image')===0){blob=items[j].getAsFile();break}}
  var reader=new FileReader();
  reader.onload=function(ev){
    var cur2=tabs[activeTab];if(!cur2||!cur2.topics[topicIdx])return;
    if(!cur2.topics[topicIdx]._images)cur2.topics[topicIdx]._images=[];
    cur2.topics[topicIdx]._images.push(ev.target.result);
    console.log('paste img idx:',cur2.topics[topicIdx]._images.length-1,'total imgs:',cur2.topics[topicIdx]._images.length);
    var ta=document.querySelectorAll('#topicList .tb textarea')[topicIdx];

function generateAllUI(){if(!activeTab)return;saveMeta();saveTopics();renderPreview();var d=tabs[activeTab],gs=document.getElementById('genStatus'),gw=document.getElementById('genWarn');gs.textContent='生成中...';gs.className='st';gw.textContent='';var allImages={};d.topics.forEach(function(t,i){if(t._images&&t._images.length)allImages[i]=t._images});fetch(API+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({meta:d.meta,topics:d.topics,movies:getPosterQuotes(),gender:d.meta.gender||'',tab_name:d.folder||activeTab,golden_quotes:getGoldenQuotes(),poster_quotes:getPosterQuotes(),feedback_styles:(document.getElementById('fbXinxin').checked?'xinxin,':'')+(document.getElementById('fbBiscuit').checked?'biscuit,':'')+(document.getElementById('fbFusion').checked?'fusion':''),images:allImages})}).then(function(r){return r.json()}).then(function(data){if(data.status==='error'){gs.textContent='失败: '+data.message;gs.className='st';gs.style.color='var(--rd)';return}gs.textContent='完成!';gs.className='st';gs.style.color='';if(data.font_warning){gw.textContent=data.font_warning}renderOutputs(data.outputs||[]);if(data.folder){if(activeTab.indexOf('-new')>-1){var newTab=data.folder;tabs[newTab]=d;delete tabs[activeTab];activeTab=newTab;d.folder=newTab;renderTabs()}fetchConfig()}renderPreview();setTimeout(function(){var gs2=document.getElementById('genStatus');if(gs2)gs2.textContent='完成!'},500)}).catch(function(e){gs.textContent='失败: '+e.message;gs.className='st';gs.style.color='var(--rd)'})}

function changeUnitPath(){
  if(!activeTab)return;
  var d=tabs[activeTab];if(!d||!d.basePath)return;
  fetch(API+'/pick-folder').then(function(r){return r.json()}).then(function(pd){
    if(!pd.path)return;
    var cls=d.meta.class||activeTab;
    var unitCode=d.folder?d.folder.split('-')[1]:'2605';
    fetch(API+'/classes/'+encodeURIComponent(cls)+'/units/'+unitCode,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:pd.path})})
      .then(function(r){return r.json()}).then(function(rd){
        if(rd.status==='ok'){d.basePath=pd.path;renderEditor()}else alert(rd.message)
      }).catch(function(){alert('更新路径失败')});
  });
}
function saveToServer(){if(!activeTab)return;saveMeta();saveTopics();var d=tabs[activeTab];var st=document.getElementById('saveStatus');st.style.display='inline';if(!d.folder){var cls=d.meta.class||activeTab;var outerInput=document.getElementById('etUnit');var unitFull=outerInput?outerInput.value||d.meta.unit||'':d.meta.unit||'';var m=unitFull.match(/(\d{4})/);var unitCode=m?m[1]:'2605';d.folder=cls+'-'+unitCode+'-new';d.basePath=''}var saveImages={};d.topics.forEach(function(t,i){if(t._images&&t._images.length)saveImages[i]=t._images});st.textContent='保存中...';fetch(API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({meta:d.meta,topics:d.topics,folder:d.folder,images:saveImages})}).then(function(r){return r.json()}).then(function(rd){if(rd.status==='ok'){st.textContent='已保存';d.folder=rd.folder||d.folder}else{st.textContent='保存失败'}setTimeout(function(){st.style.display='none'},2000)}).catch(function(){st.textContent='保存失败';setTimeout(function(){st.style.display='none'},2000)})}
function saveAll(){localStorage.setItem('tabsData',JSON.stringify(tabs))}
setInterval(saveAll,300000);
window.addEventListener('beforeunload',saveAll);
</script></body></html>
